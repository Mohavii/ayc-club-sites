<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapports · Portail YOUTHCLUBber</title><link rel="icon" href="../assets/favicon-32.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet"><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="portal.css"></head>
<body><div id="topbar-root"></div><div class="workspace"><div id="sidebar-root"></div><main class="portal-content"><div class="portal-heading"><div><p class="eyebrow">Suivi et validation</p><h1>Mes rapports</h1><p>Un tableau commun pour suivre les pré-projets, procès-verbaux, partenariats et mises à jour selon ton périmètre.</p></div></div><div id="notice"></div><section class="portal-card" id="new"><div class="toolbar"><h2>Tableau de suivi</h2><div class="filter-tabs"><button class="active" data-filter="all">Tous</button><button data-filter="pre_projet">Pré-projet</button><button data-filter="post_projet">Post-projet</button><button data-filter="proces_verbal">PV</button><button data-filter="mise_a_jour">Mise à jour</button></div></div><div class="table-wrap"><table class="portal-table"><thead><tr><th>Soumission</th><th>Type / titre</th><th>Date</th><th>Validité</th><th>Action</th></tr></thead><tbody id="report-rows"></tbody></table></div></section><section class="portal-card" style="margin-top:18px"><h2>Créer une soumission</h2><form id="report-form"><div class="form-grid"><div class="form-field"><label for="reportType">Type</label><select id="reportType"><option value="pre_projet">Pré-projet</option><option value="post_projet">Post-projet</option><option value="proces_verbal">Procès-verbal</option><option value="collaboration">Collaboration / partenariat</option><option value="mise_a_jour">Mise à jour</option></select></div><div class="form-field"><label for="title">Titre</label><input id="title" required placeholder="Titre du dossier"></div><div class="form-field"><label for="eventDate">Date du projet</label><input id="eventDate" type="date"></div><div class="form-field full"><label for="description">Description</label><textarea id="description" placeholder="Contexte, objectifs, liens et informations utiles"></textarea></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Enregistrer et soumettre</button></div></form></section></main></div>
<script src="portal-common.js"></script><script>
(async()=>{const body=document.getElementById('report-rows');let all=[];try{const m=await AYCPortal.initPortalShell({requireActive:true});if(!m)return;const render=filter=>{const rows=filter==='all'?all:all.filter(r=>r.report_type===filter);body.innerHTML=rows.length?rows.map(r=>`<tr><td>${AYCPortal.formatDate(r.created_at)}</td><td><strong>${AYCPortal.escapeHtml(r.title)}</strong><br><small>${AYCPortal.escapeHtml(r.report_type.replaceAll('_',' '))}</small></td><td>${AYCPortal.formatDate(r.event_date)}</td><td><span class="status-badge status-${r.status}">${AYCPortal.statusLabel(r.status)}</span></td><td><button class="btn btn-secondary btn-sm" data-review="${r.id}">Détails</button></td></tr>`).join(''): `<tr><td colspan="5">${AYCPortal.renderEmpty('Aucun rapport dans ce périmètre')}</td></tr>`;};all=(await AYCPortal.api('reports')).reports||[];render('all');document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)}));document.getElementById('report-form').addEventListener('submit',async e=>{e.preventDefault();const f=id=>document.getElementById(id).value;try{await AYCPortal.api('reports',{method:'POST',body:{reportType:f('reportType'),title:f('title'),eventDate:f('eventDate'),description:f('description')}});location.reload()}catch(err){AYCPortal.renderError(document.getElementById('notice'),err)}})}catch(e){AYCPortal.renderError(document.getElementById('notice'),e)}})();
</script></body></html>
