<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supervision · Portail YOUTHCLUBber</title><link rel="icon" href="../assets/favicon-32.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet"><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="portal.css"></head>
<body><div id="topbar-root"></div><div class="workspace"><div id="sidebar-root"></div><main class="portal-content"><div class="portal-heading"><div><p class="eyebrow">Pouvoir judiciaire interne</p><h1>Supervision</h1><p>Les dossiers de supervision sont gérés par les Conseils de Supervision et les personnes expressément mandatées.</p></div></div><div id="notice"></div><div id="supervision-workspace"><section class="portal-card"><div class="filter-tabs" id="tabs"><button class="active" data-tab="supervision">Supervision</button><button data-tab="investigations">Investigations</button><button data-tab="update">Mise à jour</button></div><div id="queue"></div></section><div class="portal-grid" style="margin-top:18px"><section class="portal-card card-span-5" id="investigation-create"><p class="eyebrow">Saisine</p><h2>Ouvrir une investigation</h2><form id="investigation-form"><div class="form-field"><label for="case-title">Titre</label><input id="case-title" required placeholder="Objet du dossier"></div><div class="form-grid"><div class="form-field"><label for="case-category">Catégorie</label><select id="case-category"><option value="communication">Communication</option><option value="personal_conflict">Problème personnel</option><option value="regulation">Règlement intérieur</option><option value="law">Loi tunisienne · SupCo national</option><option value="other">Autre</option></select></div><div class="form-field"><label for="case-level">Niveau</label><select id="case-level"><option value="local">Local</option><option value="national">National</option></select></div></div><div class="form-field"><label for="case-summary">Résumé</label><textarea id="case-summary" placeholder="Faits connus, source et mesure de suivi"></textarea></div><div class="form-actions"><button class="btn btn-primary" type="submit">Créer le dossier</button></div></form></section><section class="portal-card card-span-7" id="case-detail"><div class="empty-state"><strong>Sélectionne une investigation</strong><span>La chronologie et les décisions apparaîtront ici.</span></div></section></div></div></main></div>
<script src="portal-common.js"></script><script>
(async()=>{const notice=document.getElementById('notice'),workspace=document.getElementById('supervision-workspace'),queue=document.getElementById('queue'),detail=document.getElementById('case-detail'),tabs=document.getElementById('tabs'),esc=AYCPortal.escapeHtml;let data={reports:[],investigations:[]},activeTab='supervision',member;const labels={open:'Ouverte',under_review:'En examen',decision:'Décision',closed:'Clôturée',dismissed:'Classée',supervision:'Supervision',national_only:'SupCo national',submitted:'Soumis',validated:'Validé',invalidated:'À corriger',pre_projet:'Pré-projet',post_projet:'Post-projet',mise_a_jour:'Mise à jour'};const apiError=e=>AYCPortal.renderError(notice,e);function renderQueue(){const rows=activeTab==='investigations'?data.investigations:activeTab==='update'?data.reports.filter(r=>r.report_type==='mise_a_jour'):data.reports.filter(r=>r.report_type!=='mise_a_jour');if(!rows.length){queue.innerHTML=AYCPortal.renderEmpty(activeTab==='investigations'?'Aucune investigation':'Aucun rapport dans cette vue');return;}queue.innerHTML=`<div class="table-wrap"><table class="portal-table"><thead><tr><th>Soumission / ouverture</th><th>Objet</th><th>Club</th><th>État</th><th>Action</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${AYCPortal.formatDate(row.created_at||row.opened_at,true)}</td><td><strong>${esc(row.title)}</strong><br><small>${esc(labels[row.report_type]||row.category||'')}</small></td><td>${esc(row.school_name||'National')}</td><td><span class="status-badge">${esc(labels[row.status]||row.status)}${row.confidentiality?` · ${esc(labels[row.confidentiality])}`:''}</span></td><td>${row.opened_at?`<button class="btn btn-secondary btn-sm" data-case="${row.id}">Consulter</button>`:'<span class="field-hint">Voir dans Rapports</span>'}</td></tr>`).join('')}</tbody></table></div>`;}
async function load(){data=await AYCPortal.api('supervision');if(data.restricted){workspace.innerHTML='<section class="portal-card restricted-state"><h2>Espace réservé</h2><p>Cette page est réservée au Conseil de Supervision et aux personnes mandatées. Les informations qui te concernent seront communiquées par les voies prévues par l’association.</p></section>';return;}renderQueue();}
async function openCase(id){try{const result=await AYCPortal.api('investigation',{query:{investigationId:id}}),c=result.investigation;detail.innerHTML=`<div class="toolbar"><div><p class="eyebrow">${esc(c.level==='national'?'Supervision nationale':'Supervision locale')}</p><h2>${esc(c.title)}</h2><p class="list-item-meta">${esc(c.school_name||'National')} · ${esc(labels[c.category]||c.category)} · ${esc(labels[c.status]||c.status)}</p></div><span class="status-badge">Dossier portail</span></div><div class="audit-timeline">${result.events.map(e=>`<article><div><strong>${esc(labels[e.event_type]||e.event_type)}</strong><span>${AYCPortal.formatDate(e.created_at,true)} · ${esc(e.actor_name||'Membre')}</span></div><p>${esc(e.content)}</p></article>`).join('')}</div><div class="form-grid"><div class="form-field"><label for="case-status">État</label><select id="case-status">${['open','under_review','decision','closed','dismissed'].map(s=>`<option value="${s}"${c.status===s?' selected':''}>${labels[s]}</option>`).join('')}</select></div><div class="form-field"><label for="case-decision">Décision / suite</label><textarea id="case-decision">${esc(c.decision||'')}</textarea></div></div><div class="form-actions"><button class="btn btn-secondary" id="save-case">Enregistrer le suivi</button></div><hr><h3>Ajouter un événement</h3><form id="event-form"><div class="form-grid"><div class="form-field"><label for="event-type">Type</label><select id="event-type"><option value="note">Note</option><option value="evidence">Preuve</option><option value="hearing">Audition</option><option value="decision">Décision</option><option value="restriction">Restriction</option></select></div><div class="form-field"><label for="event-content">Contenu</label><textarea id="event-content" required></textarea></div></div><button class="btn btn-primary btn-sm">Ajouter à la chronologie</button></form>`;document.getElementById('save-case').onclick=async()=>{try{await AYCPortal.api('investigation',{method:'POST',body:{action:'update',investigationId:id,status:document.getElementById('case-status').value,decision:document.getElementById('case-decision').value}});await openCase(id);await load();}catch(e){apiError(e);}};document.getElementById('event-form').onsubmit=async e=>{e.preventDefault();try{await AYCPortal.api('investigation',{method:'POST',body:{action:'event',investigationId:id,eventType:document.getElementById('event-type').value,content:document.getElementById('event-content').value}});await openCase(id);await load();}catch(e){apiError(e);}};detail.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){apiError(e);}}
try{member=await AYCPortal.initPortalShell({requireActive:true});if(!member)return;if(!member.access?.canReviewSupervision&&!member.isNationalAdmin){await load();return;}tabs.onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;activeTab=b.dataset.tab;tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));renderQueue();};queue.onclick=e=>{const b=e.target.closest('[data-case]');if(b)openCase(b.dataset.case);};document.getElementById('investigation-form').onsubmit=async e=>{e.preventDefault();try{await AYCPortal.api('supervision',{method:'POST',body:{action:'open_investigation',title:document.getElementById('case-title').value,category:document.getElementById('case-category').value,level:document.getElementById('case-level').value,summary:document.getElementById('case-summary').value}});e.target.reset();notice.innerHTML='<div class="alert alert-success">Le dossier a été créé.</div>';await load();}catch(err){apiError(err);}};await load();}catch(e){apiError(e);}})();
</script></body></html>
