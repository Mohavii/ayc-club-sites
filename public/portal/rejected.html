<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demande non approuvée · Portail YOUTHCLUBber</title>
<link rel="icon" type="image/png" href="../assets/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<div class="pattern-veil"></div>
<div id="topbar-root"></div>

<main class="portal-shell" style="max-width:480px;">
  <div class="portal-card" style="text-align:center;">
    <h1 class="portal-title">Demande non approuvée</h1>
    <div class="status-banner rejected" id="reason-banner">
      Ta demande d'adhésion n'a pas été approuvée par ton club.
    </div>
    <p class="portal-subtitle" style="margin-bottom:0;">Si tu penses qu'il s'agit d'une erreur, contacte ton club directement.</p>
  </div>
</main>

<script src="portal-common.js"></script>
<script>
(async function () {
  const member = await window.AYCPortal.initPortalShell();
  if (!member) {
    window.location.href = "login";
    return;
  }
  if (member.status === "active") { window.location.href = "home"; return; }
  if (member.status === "pending") { window.location.href = "pending"; return; }

  if (member.rejectionNote) {
    document.getElementById("reason-banner").textContent =
      "Ta demande d'adhésion n'a pas été approuvée : " + member.rejectionNote;
  }
})();
</script>
</body>
</html>
