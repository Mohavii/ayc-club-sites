<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réunions · Portail YOUTHCLUBber</title><link rel="icon" href="../assets/favicon-32.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet"><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="portal.css"></head>
<body><div id="topbar-root"></div><div class="workspace"><div id="sidebar-root"></div><main class="portal-content"><div class="portal-heading"><div><p class="eyebrow">Vie du club</p><h1>Réunions & procès-verbaux</h1><p>Annonce les temps forts, confirme ta présence et documente les décisions au fil de la réunion.</p></div></div><div id="notice"></div><div class="portal-grid"><section class="portal-card card-span-8"><div class="toolbar"><h2>Calendrier des réunions</h2><div class="filter-tabs"><button class="active" data-filter="all">Toutes</button><button data-filter="reunion">Réunions</button><button data-filter="assemblee_locale">Assemblée locale</button><button data-filter="assemblee_generale">Assemblée générale</button></div></div><div id="meeting-list" class="list-stack"></div></section><section class="portal-card card-span-4" id="new"><h2>Annoncer une réunion</h2><form id="meeting-form"><div class="form-field"><label for="title">Titre</label><input id="title" required placeholder="Réunion mensuelle"></div><div class="form-grid"><div class="form-field"><label for="meetingType">Type</label><select id="meetingType"><option value="reunion">Réunion</option><option value="assemblee_locale">Assemblée locale</option><option value="assemblee_generale">Assemblée générale</option></select></div><div class="form-field"><label for="format">Format</label><select id="format"><option value="presentiel">Présentiel</option><option value="en_ligne">En ligne</option><option value="hybride">Hybride</option></select></div></div><div class="form-grid"><div class="form-field"><label for="startsAt">Début</label><input id="startsAt" type="datetime-local" required></div><div class="form-field"><label for="endsAt">Fin</label><input id="endsAt" type="datetime-local"></div></div><div class="form-field"><label for="location">Lieu / lien</label><input id="location" placeholder="Maison des jeunes ou lien visio"><input id="mapsUrl" placeholder="Lien Google Maps (optionnel)"></div><div class="form-field"><label for="comments">Commentaires</label><textarea id="comments" placeholder="Informations pratiques"></textarea></div><div class="form-field"><label for="agenda">Ordre du jour</label><textarea id="agenda" placeholder="Un point par ligne, avec la durée si besoin"></textarea></div><div class="form-actions"><button class="btn btn-primary" type="submit">Publier la réunion</button></div></form></section></div></main></div>
<script src="portal-common.js"></script><script>
(async()=>{const list=document.getElementById('meeting-list');let all=[];try{const member=await AYCPortal.initPortalShell({requireActive:true});if(!member)return;const render=filter=>{const rows=filter==='all'?all:all.filter(x=>x.meeting_type===filter);list.innerHTML=rows.length?rows.map(m=>`<article class="list-item" data-id="${m.id}"><div class="list-item-main"><span class="list-item-title">${AYCPortal.escapeHtml(m.title)}</span><span class="list-item-meta">${AYCPortal.formatDate(m.starts_at,true)} · ${AYCPortal.escapeHtml(m.school_name||'Mon club')} · ${AYCPortal.escapeHtml(m.format)}</span></div><div class="heading-actions"><span class="status-badge">${m.meeting_type.replaceAll('_',' ')}</span><button class="btn btn-secondary btn-sm" data-open="${m.id}">Détails</button></div></article>`).join(''):AYCPortal.renderEmpty('Aucune réunion enregistrée');};all=(await AYCPortal.api('meetings')).meetings||[];render('all');document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter);}));list.addEventListener('click',async e=>{const id=e.target.dataset.open;if(!id)return;const data=await AYCPortal.api('meeting',{query:{meetingId:id}});const m=data.meeting;const agenda=Array.isArray(m.agenda)?m.agenda:[];const block=document.createElement('div');block.className='portal-card';block.style.marginTop='14px';block.innerHTML=`<h2>${AYCPortal.escapeHtml(m.title)}</h2><p class="list-item-meta">${AYCPortal.formatDate(m.starts_at,true)} · ${AYCPortal.escapeHtml(m.location||'Format en ligne')}</p><h3>Ordre du jour</h3>${agenda.length?`<ol>${agenda.map(x=>`<li>${AYCPortal.escapeHtml(typeof x==='string'?x:x.title||'Point')}</li>`).join('')}</ol>`:AYCPortal.renderEmpty('Ordre du jour à compléter')}<div class="form-actions"><button class="btn btn-secondary btn-sm" data-rsvp="present">Je serai présent·e</button><button class="btn btn-secondary btn-sm" data-rsvp="absent">Absent·e</button><button class="btn btn-primary btn-sm" data-minutes="${m.id}">Ouvrir le PV</button></div><div id="minutes-${m.id}"></div>`;e.target.closest('article').after(block);block.querySelectorAll('[data-rsvp]').forEach(b=>b.addEventListener('click',async()=>{await AYCPortal.api('meeting',{method:'POST',body:{action:'rsvp',meetingId:id,rsvp:b.dataset.rsvp}});b.textContent='Réponse enregistrée';}));block.querySelector('[data-minutes]').addEventListener('click',()=>{const target=block.querySelector(`#minutes-${m.id}`);target.innerHTML=`<div class="form-grid"><div class="form-field"><label>Mode</label><select id="mode-${m.id}"><option value="standard">PV standard</option><option value="assemblee_generale">PV assemblée générale</option></select></div><div class="form-field"><label>Mandat</label><input id="mandate-${m.id}"></div><div class="form-field full"><label>Conclusions / points discutés</label><textarea id="agendaBlocks-${m.id}" placeholder="Un bloc par point à l'ordre du jour"></textarea></div><div class="form-field full"><label>Motion(s), pour une assemblée générale</label><textarea id="motions-${m.id}" placeholder="Nom · proposant · secondant · résultat"></textarea></div></div><div class="form-actions"><button class="btn btn-primary" id="save-minutes-${m.id}">Enregistrer le brouillon</button></div>`;target.querySelector('button').addEventListener('click',async()=>{await AYCPortal.api('meeting',{method:'POST',body:{action:'save_minutes',meetingId:id,mode:document.getElementById(`mode-${m.id}`).value,mandate:document.getElementById(`mandate-${m.id}`).value,agendaBlocks:document.getElementById(`agendaBlocks-${m.id}`).value.split('\n').filter(Boolean),motions:document.getElementById(`motions-${m.id}`).value.split('\n').filter(Boolean),status:'draft'}});target.insertAdjacentHTML('beforeend','<div class="alert alert-success">Brouillon du PV enregistré.</div>');});});});document.getElementById('meeting-form').addEventListener('submit',async e=>{e.preventDefault();const f=id=>document.getElementById(id).value;try{await AYCPortal.api('meetings',{method:'POST',body:{title:f('title'),meetingType:f('meetingType'),format:f('format'),startsAt:f('startsAt'),endsAt:f('endsAt'),location:f('location'),mapsUrl:f('mapsUrl'),comments:f('comments'),agenda:f('agenda').split('\n').filter(Boolean)}});location.reload();}catch(err){AYCPortal.renderError(document.getElementById('notice'),err);}});}catch(e){AYCPortal.renderError(document.getElementById('notice'),e);}})();
</script></body></html>
