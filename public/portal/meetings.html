<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Réunions · Portail YOUTHCLUBber</title>
  <link rel="icon" href="../assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="portal.css">
  <style>
    .pv-table{width:100%;border-collapse:collapse}
    .pv-table th,.pv-table td{border:1px solid var(--border,#dfe3ee);padding:10px;vertical-align:top;font-size:.92rem}
    .pv-table thead th{background:#2f4bd0;color:#fff;font-weight:600}
    .pv-table textarea{width:100%;min-height:64px;resize:vertical;font:inherit}
    .pv-table input[type="text"],.pv-table input[type="number"],.pv-table input[type="url"]{width:100%;font:inherit}
    .pv-attachments{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .pv-attachment-pill{display:inline-flex;align-items:center;gap:6px;background:#eef0fa;border-radius:999px;padding:4px 10px;font-size:.82rem}
    .pv-attachment-pill button{border:none;background:none;cursor:pointer;color:#8a8fa6;font-size:.9rem;line-height:1}
    .pv-add-file{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
    .pv-add-file input{flex:1;min-width:110px}
    .pv-point-remove{margin-top:6px}
    .agenda-builder-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .agenda-builder-row input[type="text"]{flex:3}
    .agenda-builder-row input[type="number"]{flex:1}
  </style>
</head>
<body>
  <div id="topbar-root"></div>
  <div class="workspace">
    <div id="sidebar-root"></div>
    <main class="portal-content">
      <div class="portal-heading"><div><p class="eyebrow">Pouvoir législatif</p><h1>Réunions</h1><p>Prépare les réunions locales et nationales et publie un procès-verbal simple : points, durées, discussions, conclusions, conduites à tenir et fichiers joints.</p></div></div>
      <div id="notice"></div>
      <div class="portal-grid">
        <section class="portal-card card-span-8"><div class="toolbar"><div><p class="eyebrow">Calendrier</p><h2>Réunions</h2></div><button class="btn btn-secondary btn-sm" id="refresh">Actualiser</button></div><div id="meeting-list" class="list-stack"></div></section>
        <section class="portal-card card-span-4" id="meeting-prep-card"><p class="eyebrow">Préparation</p><h2>Nouvelle réunion</h2><form id="meeting-form">
          <div class="form-field"><label for="meetingType">Type</label><select id="meetingType"><option value="reunion_locale">Réunion locale</option><option value="reunion_nationale">Réunion nationale</option></select></div>
          <div class="form-field"><label for="meetingTitle">Titre</label><input id="meetingTitle" required placeholder="Réunion hebdomadaire du bureau"></div>
          <div class="form-field"><label for="startsAt">Date et heure</label><input id="startsAt" type="datetime-local" required></div>
          <div class="form-field"><label for="format">Format</label><select id="format"><option value="presentiel">Présentiel</option><option value="en_ligne">En ligne</option><option value="hybride">Hybride</option></select></div>
          <div class="form-field"><label for="location">Lieu / lien</label><input id="location" placeholder="Local, ou lien de visio"></div>
          <div class="form-field"><label for="comments">Commentaires</label><input id="comments"></div>
          <div class="form-field">
            <label>Ordre du jour (point et durée estimée)</label>
            <div id="agenda-builder"></div>
            <button type="button" class="btn btn-quiet btn-sm" id="add-agenda-item">+ Ajouter un point</button>
          </div>
          <div class="form-actions"><button class="btn btn-primary" type="submit">Préparer la réunion</button></div>
        </form></section>
      </div>
      <div id="meeting-detail"></div>
    </main>
  </div>
<script src="portal-common.js"></script>
<script>
(async () => {
  const notice = document.getElementById('notice'); const list = document.getElementById('meeting-list'); const detail = document.getElementById('meeting-detail'); const esc = AYCPortal.escapeHtml;
  const typeLabels = { reunion_locale: 'Réunion locale', reunion_nationale: 'Réunion nationale', reunion: 'Réunion' };
  const statusLabels = { planned: 'Planifiée', live: 'En cours', completed: 'Terminée', cancelled: 'Annulée' };
  const rsvpLabels = { pending: 'En attente', present: 'Présent·e', absent: 'Absent·e' };
  const REUNION_TYPES = ['reunion_locale', 'reunion_nationale', 'reunion'];
  let member;
  const apiError = error => AYCPortal.renderError(notice, error);

  // ---- Nouvelle réunion : constructeur d'ordre du jour ---------------------
  let agendaRowId = 0;
  function addAgendaRow(title = '', duration = '') {
    const id = `agenda-row-${agendaRowId++}`;
    const row = document.createElement('div');
    row.className = 'agenda-builder-row';
    row.id = id;
    row.innerHTML = `<input type="text" class="agenda-item-title" placeholder="Point de l'ordre du jour" value="${esc(title)}"><input type="number" class="agenda-item-duration" min="0" placeholder="Durée est. (min)" value="${esc(duration)}"><button type="button" class="btn btn-quiet btn-sm" data-remove-agenda>✕</button>`;
    document.getElementById('agenda-builder').appendChild(row);
    row.querySelector('[data-remove-agenda]').addEventListener('click', () => row.remove());
  }
  document.getElementById('add-agenda-item').addEventListener('click', () => addAgendaRow());
  addAgendaRow();

  function collectAgendaItems() {
    return Array.from(document.querySelectorAll('#agenda-builder .agenda-builder-row')).map(row => ({
      title: row.querySelector('.agenda-item-title').value.trim(),
      durationMinutes: row.querySelector('.agenda-item-duration').value ? Number(row.querySelector('.agenda-item-duration').value) : null,
    })).filter(item => item.title);
  }

  // ---- Liste -----------------------------------------------------------
  function renderList(rows) {
    const filtered = rows.filter(m => REUNION_TYPES.includes(m.meeting_type));
    if (!filtered.length) { list.innerHTML = AYCPortal.renderEmpty('Aucune réunion planifiée'); return; }
    list.innerHTML = filtered.map(m => `<article class="list-item"><div class="meeting-date"><strong>${new Date(m.starts_at).toLocaleDateString('fr-FR',{day:'2-digit'})}</strong><span>${new Date(m.starts_at).toLocaleDateString('fr-FR',{month:'short'})}</span></div><div class="list-item-main"><span class="list-item-title">${esc(m.title)}</span><span class="list-item-meta">${esc(typeLabels[m.meeting_type] || m.meeting_type)} · ${esc(m.school_name || 'National')} · ${AYCPortal.formatDate(m.starts_at, true)}</span><span class="list-item-meta">${m.attendee_count || 0} réponse(s)</span></div><div class="heading-actions"><span class="status-badge">${esc(statusLabels[m.status] || m.status)}</span><button class="btn btn-secondary btn-sm" data-open="${m.id}">Ouvrir</button></div></article>`).join('');
  }
  async function load() { const data = await AYCPortal.api('meetings'); renderList(data.meetings || []); }

  // ---- Silhouette PV : lecture seule ------------------------------------
  function renderPublishedPV(data) {
    const minutes = data.minutes;
    if (!minutes || !['sent', 'validated'].includes(minutes.status)) return '<div class="restricted-note" style="margin-top:18px">Le procès-verbal sera visible ici dès qu’il sera publié.</div>';
    const blocks = data.structured?.agendaBlocks || [];
    const statusText = minutes.status === 'validated' ? 'Validé' : 'Publié';
    const rows = blocks.length ? blocks.map(b => `<tr>
        <td>${esc(b.title || '—')}${b.duration_minutes ? `<br><span class="list-item-meta">${b.duration_minutes} min est.</span>` : ''}</td>
        <td>${b.actual_duration_minutes ? `${b.actual_duration_minutes} min` : '—'}</td>
        <td>${esc(b.discussion || '—')}</td>
        <td>${esc(b.decision || '—')}</td>
        <td>${esc(b.next_steps || '—')}</td>
        <td>${(b.attachments || []).length ? b.attachments.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name || f.url)}</a>`).join('<br>') : '—'}</td>
      </tr>`).join('') : `<tr><td colspan="6">${AYCPortal.renderEmpty('Aucun point détaillé dans ce PV')}</td></tr>`;
    return `<section class="portal-card meeting-minutes-card" style="margin-top:18px"><div class="toolbar"><div><p class="eyebrow">Document officiel</p><h2>Procès-verbal publié</h2><p class="list-item-meta">${esc(statusText)}${minutes.organizer ? ` · Rédaction : ${esc(minutes.organizer)}` : ''}</p></div><span class="status-badge">${esc(statusText)}</span></div>
      <div class="table-wrap"><table class="pv-table"><thead><tr><th>Point de l'ordre du jour et sa durée estimée</th><th>Durée réelle du point</th><th>Discussions</th><th>Conclusions</th><th>Conduites à tenir et échéances</th><th>Fichiers joints</th></tr></thead><tbody>${rows}</tbody></table></div>
    </section>`;
  }

  // ---- Silhouette PV : édition -------------------------------------------
  let pvBlocks = [];
  function seedPvBlocks(data) {
    const saved = data.structured?.agendaBlocks || [];
    if (saved.length) {
      pvBlocks = saved.map(b => ({ title: b.title || '', durationMinutes: b.duration_minutes || null, actualDurationMinutes: b.actual_duration_minutes || null, discussion: b.discussion || '', decision: b.decision || '', nextSteps: b.next_steps || '', attachments: b.attachments || [] }));
    } else {
      pvBlocks = (data.agendaItems || []).map(item => ({ title: item.title || '', durationMinutes: item.duration_minutes || null, actualDurationMinutes: null, discussion: '', decision: '', nextSteps: '', attachments: [] }));
    }
    if (!pvBlocks.length) pvBlocks = [{ title: '', durationMinutes: null, actualDurationMinutes: null, discussion: '', decision: '', nextSteps: '', attachments: [] }];
  }

  function pvEditorRow(block, index) {
    const attachmentsHtml = (block.attachments || []).map((f, fi) => `<span class="pv-attachment-pill">${esc(f.name || f.url)}<button type="button" data-remove-file="${index}:${fi}">✕</button></span>`).join('');
    return `<tr data-block="${index}">
      <td>
        <input type="text" class="pv-title" placeholder="Point de l'ordre du jour" value="${esc(block.title)}">
        <input type="number" class="pv-duration" min="0" placeholder="Durée estimée (min)" value="${block.durationMinutes ?? ''}" style="margin-top:6px">
      </td>
      <td><input type="number" class="pv-actual-duration" min="0" placeholder="min" value="${block.actualDurationMinutes ?? ''}"></td>
      <td><textarea class="pv-discussion" placeholder="Discussions">${esc(block.discussion)}</textarea></td>
      <td><textarea class="pv-decision" placeholder="Conclusions">${esc(block.decision)}</textarea></td>
      <td><textarea class="pv-next-steps" placeholder="Conduites à tenir et échéances">${esc(block.nextSteps)}</textarea></td>
      <td>
        <div class="pv-attachments">${attachmentsHtml}</div>
        <div class="pv-add-file"><input type="text" class="pv-file-name" placeholder="Nom du fichier"><input type="url" class="pv-file-url" placeholder="Lien"><button type="button" class="btn btn-quiet btn-sm" data-add-file="${index}">+</button></div>
        <button type="button" class="btn btn-quiet btn-sm pv-point-remove" data-remove-point="${index}">Supprimer ce point</button>
      </td>
    </tr>`;
  }

  function renderPvEditor(meetingId, canEditPV, minutes) {
    if (!canEditPV) return '';
    const rowsHtml = pvBlocks.map((b, i) => pvEditorRow(b, i)).join('');
    return `<section class="portal-card" style="margin-top:18px"><div class="toolbar"><div><p class="eyebrow">Procès-verbal</p><h2>Rédiger le PV</h2></div></div>
      <div class="table-wrap"><table class="pv-table" id="pv-editor-table"><thead><tr><th>Point de l'ordre du jour et sa durée estimée</th><th>Durée réelle du point</th><th>Discussions</th><th>Conclusions</th><th>Conduites à tenir et échéances</th><th>Fichiers joints</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>
      <button type="button" class="btn btn-quiet btn-sm" id="pv-add-point" style="margin-top:10px">+ Ajouter un point</button>
      <div class="form-grid" style="margin-top:14px">
        <div class="form-field"><label for="pv-organizer">Rédigé par</label><input id="pv-organizer" value="${esc(minutes?.organizer || '')}"></div>
        <div class="form-field"><label for="pv-status">Statut</label><select id="pv-status"><option value="draft"${(!minutes || minutes.status==='draft') ? ' selected' : ''}>Brouillon</option><option value="sent"${minutes?.status==='sent' ? ' selected' : ''}>Publié</option><option value="validated"${minutes?.status==='validated' ? ' selected' : ''}>Validé</option></select></div>
      </div>
      <div class="form-actions"><button type="button" class="btn btn-primary" id="pv-save" data-meeting="${meetingId}">Enregistrer le PV</button></div>
    </section>`;
  }

  function bindPvEditor(meetingId) {
    const table = document.getElementById('pv-editor-table');
    if (!table) return;
    function readRowsIntoState() {
      table.querySelectorAll('tr[data-block]').forEach(row => {
        const i = Number(row.dataset.block);
        if (!pvBlocks[i]) return;
        pvBlocks[i].title = row.querySelector('.pv-title').value.trim();
        pvBlocks[i].durationMinutes = row.querySelector('.pv-duration').value ? Number(row.querySelector('.pv-duration').value) : null;
        pvBlocks[i].actualDurationMinutes = row.querySelector('.pv-actual-duration').value ? Number(row.querySelector('.pv-actual-duration').value) : null;
        pvBlocks[i].discussion = row.querySelector('.pv-discussion').value.trim();
        pvBlocks[i].decision = row.querySelector('.pv-decision').value.trim();
        pvBlocks[i].nextSteps = row.querySelector('.pv-next-steps').value.trim();
      });
    }
    document.getElementById('pv-add-point').addEventListener('click', () => {
      readRowsIntoState();
      pvBlocks.push({ title: '', durationMinutes: null, actualDurationMinutes: null, discussion: '', decision: '', nextSteps: '', attachments: [] });
      table.querySelector('tbody').innerHTML = pvBlocks.map((b, i) => pvEditorRow(b, i)).join('');
      bindRowFileButtons();
    });
    function bindRowFileButtons() {
      table.querySelectorAll('[data-add-file]').forEach(btn => btn.addEventListener('click', () => {
        readRowsIntoState();
        const i = Number(btn.dataset.addFile);
        const row = table.querySelector(`tr[data-block="${i}"]`);
        const name = row.querySelector('.pv-file-name').value.trim();
        const url = row.querySelector('.pv-file-url').value.trim();
        if (!url) return;
        pvBlocks[i].attachments = [...(pvBlocks[i].attachments || []), { name: name || url, url }];
        table.querySelector('tbody').innerHTML = pvBlocks.map((b, ii) => pvEditorRow(b, ii)).join('');
        bindRowFileButtons();
      }));
      table.querySelectorAll('[data-remove-file]').forEach(btn => btn.addEventListener('click', () => {
        readRowsIntoState();
        const [i, fi] = btn.dataset.removeFile.split(':').map(Number);
        pvBlocks[i].attachments.splice(fi, 1);
        table.querySelector('tbody').innerHTML = pvBlocks.map((b, ii) => pvEditorRow(b, ii)).join('');
        bindRowFileButtons();
      }));
      table.querySelectorAll('[data-remove-point]').forEach(btn => btn.addEventListener('click', () => {
        readRowsIntoState();
        const i = Number(btn.dataset.removePoint);
        if (pvBlocks.length <= 1) return;
        pvBlocks.splice(i, 1);
        table.querySelector('tbody').innerHTML = pvBlocks.map((b, ii) => pvEditorRow(b, ii)).join('');
        bindRowFileButtons();
      }));
    }
    bindRowFileButtons();
    document.getElementById('pv-save').addEventListener('click', async () => {
      readRowsIntoState();
      try {
        await AYCPortal.api('meeting', { method: 'POST', body: {
          action: 'save_minutes', meetingId,
          organizer: document.getElementById('pv-organizer').value.trim(),
          status: document.getElementById('pv-status').value,
          agendaBlocks: pvBlocks.filter(b => b.title),
        } });
        notice.innerHTML = '<div class="alert alert-success">Le procès-verbal a été enregistré.</div>';
        await openMeeting(meetingId);
      } catch (e) { apiError(e); }
    });
  }

  // ---- Détail -------------------------------------------------------------
  function renderDetail(data) {
    const m = data.meeting;
    const canEditPV = Boolean(data.canEditPV || member?.isNationalAdmin);
    seedPvBlocks(data);
    const agendaHtml = (data.agendaItems || []).length ? `<ul class="list-stack">${data.agendaItems.map(i => `<li class="list-item"><div class="list-item-main"><span class="list-item-title">${esc(i.title)}</span>${i.duration_minutes ? `<span class="list-item-meta">${i.duration_minutes} min estimées</span>` : ''}</div></li>`).join('')}</ul>` : AYCPortal.renderEmpty('Aucun point à l’ordre du jour');
    const attendeesHtml = (data.attendees || []).length ? `<div class="table-wrap"><table class="portal-table"><thead><tr><th>Membre</th><th>Réponse</th></tr></thead><tbody>${data.attendees.map(a => `<tr><td>${esc(a.display_name || a.username)}</td><td>${esc(rsvpLabels[a.rsvp] || a.rsvp)}</td></tr>`).join('')}</tbody></table></div>` : AYCPortal.renderEmpty('Aucune réponse pour le moment');
    const myRsvp = (data.attendees || []).find(a => a.member_id === member.id)?.rsvp || 'pending';
    detail.innerHTML = `<div class="portal-grid" style="margin-top:18px">
        <section class="portal-card card-span-8"><div class="toolbar"><div><p class="eyebrow">${esc(typeLabels[m.meeting_type] || m.meeting_type)}</p><h2>${esc(m.title)}</h2><p class="list-item-meta">${AYCPortal.formatDate(m.starts_at, true)} · ${esc(m.location || 'Lieu à confirmer')}${m.school_name ? ` · ${esc(m.school_name)}` : ''}</p></div><span class="status-badge">${esc(statusLabels[m.status] || m.status)}</span></div>
          <h3>Ordre du jour</h3>${agendaHtml}
          ${m.comments ? `<h3 style="margin-top:18px">Commentaires</h3><p>${esc(m.comments)}</p>` : ''}
        </section>
        <section class="portal-card card-span-4">
          <p class="eyebrow">Ma présence</p><h2>RSVP</h2>
          <div class="form-actions">
            <button class="btn btn-sm ${myRsvp==='present'?'btn-primary':'btn-secondary'}" data-rsvp="present">Présent·e</button>
            <button class="btn btn-sm ${myRsvp==='absent'?'btn-primary':'btn-secondary'}" data-rsvp="absent">Absent·e</button>
          </div>
          <h3 style="margin-top:18px">Réponses</h3>${attendeesHtml}
        </section>
      </div>
      ${renderPvEditor(m.id, canEditPV, data.minutes)}
      ${!canEditPV ? renderPublishedPV(data) : ''}
    `;
    detail.querySelectorAll('[data-rsvp]').forEach(btn => btn.addEventListener('click', async () => {
      try { await AYCPortal.api('meeting', { method: 'POST', body: { action: 'rsvp', meetingId: m.id, rsvp: btn.dataset.rsvp } }); await openMeeting(m.id); } catch (e) { apiError(e); }
    }));
    bindPvEditor(m.id);
    detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  async function openMeeting(id) { try { renderDetail(await AYCPortal.api('meeting', { query: { meetingId: id } })); } catch (e) { apiError(e); } }
  list.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) openMeeting(b.dataset.open); });
  document.getElementById('refresh').onclick = () => load().catch(apiError);

  document.getElementById('meeting-form').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await AYCPortal.api('meetings', { method: 'POST', body: {
        action: 'create',
        meetingType: document.getElementById('meetingType').value,
        title: document.getElementById('meetingTitle').value,
        startsAt: document.getElementById('startsAt').value,
        format: document.getElementById('format').value,
        location: document.getElementById('location').value,
        comments: document.getElementById('comments').value,
        agendaItems: collectAgendaItems(),
      } });
      e.target.reset();
      document.getElementById('agenda-builder').innerHTML = '';
      addAgendaRow();
      notice.innerHTML = '<div class="alert alert-success">La réunion a été préparée.</div>';
      await load();
    } catch (err) { apiError(err); }
  });

  try {
    member = await AYCPortal.initPortalShell({ requireActive: true });
    if (!member) return;
    if (!member.isNationalAdmin) {
      document.querySelectorAll('#meetingType option[value="reunion_nationale"]').forEach(o => o.remove());
    }
    await load();
  } catch (e) { apiError(e); }
})();
</script>
</body>
</html>
