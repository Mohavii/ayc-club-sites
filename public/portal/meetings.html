<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Réunions & PV · Portail YOUTHCLUBber</title>
  <link rel="icon" href="../assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <div id="topbar-root"></div>
  <div class="workspace">
    <div id="sidebar-root"></div>
    <main class="portal-content">
      <div class="portal-heading">
        <div>
          <p class="eyebrow">Vie du club</p>
          <h1>Réunions & procès-verbaux</h1>
          <p>Prépare les temps forts, suis le quorum et conserve des décisions lisibles, structurées et vérifiables.</p>
        </div>
      </div>
      <div id="notice"></div>

      <div class="portal-grid">
        <section class="portal-card card-span-8">
          <div class="toolbar">
            <div><p class="eyebrow">Calendrier de travail</p><h2>Réunions à venir et archivées</h2></div>
            <div class="filter-tabs" id="filters">
              <button class="active" data-filter="all">Toutes</button><button data-filter="upcoming">À venir</button><button data-filter="archived">Archives</button>
              <button data-filter="reunion_locale">Réunions locales</button>
              <button data-filter="reunion_nationale">Réunions nationales</button>
              <button data-filter="assemblee_locale">Assemblées locales</button>
              <button data-filter="assemblee_generale">Assemblées générales</button>
            </div>
          </div>
          <div id="meeting-list" class="list-stack"></div>
        </section>

        <section class="portal-card card-span-4" id="new">
          <p class="eyebrow">Organisation</p>
          <h2>Créer un rendez-vous</h2>
          <form id="meeting-form">
            <div class="form-field"><label for="title">Titre</label><input id="title" required placeholder="Réunion mensuelle"></div>
            <div class="form-grid">
              <div class="form-field"><label for="meetingType">Type</label><select id="meetingType"><option value="reunion_locale">Réunion locale</option><option value="reunion_nationale">Réunion nationale</option><option value="assemblee_locale">Assemblée locale</option><option value="assemblee_generale">Assemblée générale</option></select></div>
              <div class="form-field"><label for="status">État</label><select id="status"><option value="planned">Planifiée</option><option value="live">En cours</option><option value="completed">Terminée</option></select></div>
            </div>
            <div class="form-grid"><div class="form-field"><label for="startsAt">Début</label><input id="startsAt" type="datetime-local" required></div><div class="form-field"><label for="endsAt">Fin</label><input id="endsAt" type="datetime-local"></div></div>
            <div class="form-grid"><div class="form-field"><label for="format">Format</label><select id="format"><option value="presentiel">Présentiel</option><option value="en_ligne">En ligne</option><option value="hybride">Hybride</option></select></div><div class="form-field"><label for="location">Lieu / lien</label><input id="location" placeholder="Maison des jeunes ou lien visio"></div></div>
            <div class="form-field"><label for="mapsUrl">Google Maps (optionnel)</label><input id="mapsUrl" type="url" placeholder="https://maps.google.com/…"></div>
            <div class="form-grid"><div class="form-field"><label for="chairId">Présidence de séance</label><select id="chairId"><option value="">À désigner</option></select></div><div class="form-field"><label for="secretaryId">Secrétariat de séance</label><select id="secretaryId"><option value="">À désigner</option></select></div></div>
            <div class="form-field"><label for="comments">Informations pratiques</label><textarea id="comments" placeholder="Consignes, documents à préparer…"></textarea></div>
            <div class="toolbar compact"><h3>Ordre du jour</h3><button type="button" id="add-agenda" class="btn btn-secondary btn-sm">Ajouter un point</button></div>
            <div id="agenda-editor" class="list-stack"></div>
            <div class="form-actions"><button class="btn btn-primary" type="submit">Publier la réunion</button></div>
          </form>
        </section>
      </div>
      <div id="detail-root"></div>
    </main>
  </div>

  <script src="portal-common.js"></script>
  <script>
  (async () => {
    const notice = document.getElementById('notice');
    const list = document.getElementById('meeting-list');
    const detailRoot = document.getElementById('detail-root');
    const agendaEditor = document.getElementById('agenda-editor');
    const esc = AYCPortal.escapeHtml;
    const label = { reunion_locale: 'Réunion locale', reunion_nationale: 'Réunion nationale', reunion: 'Réunion', assemblee_locale: 'Assemblée locale', assemblee_generale: 'Assemblée générale', planned: 'Planifiée', live: 'En cours', completed: 'Terminée', cancelled: 'Annulée' };
    let allMeetings = [];
    let roster = [];
    let nationalClubs = [];
    let member = null;
    let activeFilter = 'all';

    const apiError = error => AYCPortal.renderError(notice, error);
    const fieldValue = id => document.getElementById(id).value;
    const memberOptions = selected => `<option value="">À désigner</option>${roster.map(m => `<option value="${m.id}"${m.id === selected ? ' selected' : ''}>${esc(m.display_name || m.username)}</option>`).join('')}`;

    function addAgendaRow(item = {}) {
      const row = document.createElement('div');
      row.className = 'list-item agenda-row';
      row.innerHTML = `<div class="form-grid" style="width:100%;align-items:end"><div class="form-field"><label>Point</label><input class="agenda-title" value="${esc(item.title || '')}" placeholder="Validation du rapport d'activité"></div><div class="form-field"><label>Durée (min)</label><input class="agenda-duration" type="number" min="1" max="600" value="${item.durationMinutes || ''}"></div><div class="form-field"><label>Note</label><input class="agenda-notes" value="${esc(item.notes || '')}" placeholder="Document ou objectif"></div><button type="button" class="btn btn-secondary btn-sm remove-agenda">Retirer</button></div>`;
      row.querySelector('.remove-agenda').addEventListener('click', () => row.remove());
      agendaEditor.appendChild(row);
    }

    function readAgenda() {
      return [...agendaEditor.querySelectorAll('.agenda-row')].map(row => ({ title: row.querySelector('.agenda-title').value.trim(), durationMinutes: Number(row.querySelector('.agenda-duration').value) || null, notes: row.querySelector('.agenda-notes').value.trim() || null })).filter(x => x.title);
    }

    function groupedMeetings(filter) {
      const rows = filter === 'all' ? allMeetings : filter === 'upcoming' ? allMeetings.filter(x => !x.is_archived) : filter === 'archived' ? allMeetings.filter(x => x.is_archived) : allMeetings.filter(x => x.meeting_type === filter);
      const groups = new Map();
      rows.forEach(m => { const key = new Date(m.starts_at).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); if (!groups.has(key)) groups.set(key, []); groups.get(key).push(m); });
      return groups;
    }

    function renderMeetings() {
      const groups = groupedMeetings(activeFilter);
      if (!groups.size) { list.innerHTML = AYCPortal.renderEmpty('Aucune réunion dans cette vue'); return; }
      list.innerHTML = [...groups.entries()].map(([month, rows]) => `<div class="month-group"><div class="month-heading"><span>${esc(month.charAt(0).toUpperCase() + month.slice(1))}</span><span class="list-item-meta">${rows.length} rendez-vous</span></div>${rows.map(m => `<article class="list-item meeting-row" data-id="${m.id}"><div class="meeting-date"><strong>${new Date(m.starts_at).toLocaleDateString('fr-FR', { day: '2-digit' })}</strong><span>${new Date(m.starts_at).toLocaleDateString('fr-FR', { weekday: 'short' })}</span></div><div class="list-item-main"><span class="list-item-title">${esc(m.title)}</span><span class="list-item-meta">${new Date(m.starts_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })} · ${esc(m.school_name || 'Mon club')} · ${esc(m.location || (m.format === 'en_ligne' ? 'En ligne' : 'Lieu à préciser'))}</span><span class="list-item-meta">${m.is_archived ? 'Réunion archivée · accès au PV uniquement' : `${m.agenda_items?.length || 0} point(s) à l'ordre du jour${m.chair_name ? ` · présidence : ${esc(m.chair_name)}` : ''}`}</span></div><div class="heading-actions"><span class="status-badge">${m.is_archived ? 'Archivée' : esc(label[m.meeting_type] || m.meeting_type)}</span><button class="btn btn-secondary btn-sm" data-open="${m.id}">${m.is_archived ? 'Voir le PV' : 'Ouvrir'}</button></div></article>`).join('')}</div>`).join('');
    }

    function renderPublishedMinutes(data) {
      const minutes = data.minutes;
      if (!minutes || !['sent', 'validated'].includes(minutes.status)) return '<div class="restricted-note" style="margin-top:18px">Le procès-verbal sera visible ici dès qu’il sera publié par la personne responsable.</div>';
      const structured = data.structured || {};
      const statusText = minutes.status === 'validated' ? 'Validé' : 'Publié';
      const attendance = structured.attendance || [];
      const blocks = structured.agendaBlocks || [];
      const motions = structured.motions || [];
      const attendanceHtml = attendance.length ? `<div class="table-wrap"><table class="portal-table"><thead><tr><th>Membre</th><th>Présence</th></tr></thead><tbody>${attendance.map(row => `<tr><td>${esc(row.display_name || row.username)}</td><td>${esc({ present: 'Présent·e', absent: 'Absent·e', excused: 'Excusé·e', late: 'En retard' }[row.attendance_status] || row.attendance_status || '—')}</td></tr>`).join('')}</tbody></table></div>` : AYCPortal.renderEmpty('Aucune feuille de présence publiée');
      const blocksHtml = blocks.length ? blocks.map((block, index) => `<div class="list-item"><div class="meeting-date"><strong>${index + 1}</strong></div><div class="list-item-main"><span class="list-item-title">${esc(block.title || 'Point')}</span>${block.discussion ? `<p class="list-item-meta"><strong>Discussion :</strong> ${esc(block.discussion)}</p>` : ''}${block.decision ? `<p class="list-item-meta"><strong>Décision :</strong> ${esc(block.decision)}</p>` : ''}</div></div>`).join('') : AYCPortal.renderEmpty('Aucun point détaillé dans ce PV');
      const motionsHtml = motions.length ? motions.map(motion => `<div class="list-item"><div class="list-item-main"><span class="list-item-title">${esc(motion.title || 'Motion')}</span><span class="list-item-meta">${esc(motion.result || 'Résultat non renseigné')}${motion.consequence ? ` · ${esc(motion.consequence)}` : ''}</span></div></div>`).join('') : AYCPortal.renderEmpty('Aucune motion publiée');
      return `<section class="portal-card meeting-minutes-card" id="published-pv" style="margin-top:18px;scroll-margin-top:20px"><div class="toolbar"><div><p class="eyebrow">Document officiel</p><h2>Procès-verbal publié</h2><p class="list-item-meta">${esc(statusText)}${minutes.organizer ? ` · Rédaction : ${esc(minutes.organizer)}` : ''}${minutes.duration_minutes ? ` · ${minutes.duration_minutes} min` : ''}</p></div><span class="status-badge">${esc(statusText)}</span></div><div class="meeting-detail-grid"><div><h3>Points discutés et décisions</h3><div class="list-stack">${blocksHtml}</div><h3 style="margin-top:22px">Motions et résultats</h3><div class="list-stack">${motionsHtml}</div></div><div><h3>Présence publiée</h3>${attendanceHtml}</div></div></section>`;
    }

    function renderEditor(data) {
      const m = data.meeting;
      if (data.archived || m.is_archived) {
        detailRoot.innerHTML = `<section class="portal-card meeting-detail-card"><div class="toolbar"><div><p class="eyebrow">Réunion archivée</p><h2>${esc(m.title)}</h2><p class="list-item-meta">${AYCPortal.formatDate(m.starts_at, true)} · ${esc(m.school_name || 'Mon club')}</p></div><button class="btn btn-secondary btn-sm" id="close-detail">Fermer</button></div>${renderPublishedMinutes(data)}</section>`;
        detailRoot.querySelector('#close-detail').onclick = () => { detailRoot.innerHTML = ''; };
        detailRoot.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      nationalClubs = data.nationalClubs || [];
      if (!member?.access?.canEditPV && !member?.isNationalAdmin) {
        const pvPublished = Boolean(data.minutes && ['sent', 'validated'].includes(data.minutes.status));
        detailRoot.innerHTML = `<section class="portal-card meeting-detail-card"><div class="toolbar"><div><p class="eyebrow">${esc(label[m.meeting_type] || m.meeting_type)}</p><h2>${esc(m.title)}</h2><p class="list-item-meta">${AYCPortal.formatDate(m.starts_at, true)} · ${esc(m.location || 'Format en ligne')} · ${esc(label[m.status] || m.status || 'Planifiée')}</p></div><div class="heading-actions">${pvPublished ? '<button class="btn btn-primary btn-sm" id="view-pv">Voir le procès-verbal</button>' : ''}<button class="btn btn-secondary btn-sm" id="close-detail">Fermer</button></div></div><div class="meeting-detail-grid"><div><h3>Ordre du jour</h3><div class="list-stack">${(data.agendaItems || []).length ? data.agendaItems.map(i => `<div class="list-item"><div class="meeting-date"><strong>${i.position + 1}</strong><span>${i.duration_minutes ? `${i.duration_minutes} min` : ''}</span></div><div class="list-item-main"><span class="list-item-title">${esc(i.title)}</span><span class="list-item-meta">${esc(i.notes || '')}</span></div></div>`).join('') : AYCPortal.renderEmpty('Ordre du jour à compléter')}</div></div><div><h3>Ma présence</h3><p class="field-hint">Confirme ta présence pour cette réunion.</p><div class="form-actions"><button class="btn btn-secondary btn-sm" data-rsvp="present">Je serai présent·e</button><button class="btn btn-secondary btn-sm" data-rsvp="absent">Je serai absent·e</button></div></div></div></section>`;
        detailRoot.insertAdjacentHTML('beforeend', renderPublishedMinutes(data));
        document.getElementById('close-detail').onclick = () => { detailRoot.innerHTML = ''; };
        document.getElementById('view-pv')?.addEventListener('click', () => { document.getElementById('published-pv')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
        detailRoot.querySelectorAll('[data-rsvp]').forEach(btn => btn.onclick = async () => { try { await AYCPortal.api('meeting', { method: 'POST', body: { action: 'rsvp', meetingId: m.id, rsvp: btn.dataset.rsvp } }); btn.textContent = 'Réponse enregistrée'; } catch (error) { apiError(error); } });
        return;
      }
      const saved = data.minutes || {};
      const structured = data.structured || {};
      const isNationalMeeting = ['reunion_nationale', 'assemblee_generale'].includes(m.meeting_type);
      const attendanceById = new Map((structured.attendance || []).map(a => [a.member_id, a]));
      const blocks = structured.agendaBlocks || [];
      const motions = structured.motions || [];
      const clubPresence = Array.isArray(saved.club_presence) ? saved.club_presence : [];
      const membershipNames = { nouveau_adherent: 'Nouveau adhérent', adherent: 'Membre actif', responsable: 'Responsable', senior: 'Senior', membre_national: 'Membre national', ancien: 'Ancien' };
      const attendanceOptions = value => ['present', 'absent', 'excused', 'late'].map(status => `<option value="${status}"${value === status ? ' selected' : ''}>${{ present: 'Présent·e', absent: 'Absent·e', excused: 'Excusé·e', late: 'En retard' }[status]}</option>`).join('');
      const nationalClubOptions = selected => nationalClubs.filter(club => club.representatives?.length).map(club => `<option value="${club.school_id}"${String(club.school_id) === String(selected) ? ' selected' : ''}>${esc(club.school_name)}</option>`).join('');
      const representativeOptions = (schoolId, selected) => (nationalClubs.find(club => String(club.school_id) === String(schoolId))?.representatives || []).map(rep => `<option value="${rep.id}"${String(rep.id) === String(selected) ? ' selected' : ''}>${esc(rep.displayName)} · ${esc(rep.role)}</option>`).join('');
      const localAttendanceRows = roster.map(row => {
        const a = attendanceById.get(row.id) || {};
        const status = row.membership_status || 'adherent';
        return `<tr data-member-id="${row.id}"><td><strong>${esc(row.display_name || row.username)}</strong><span class="list-item-meta">@${esc(row.username || '')}</span></td><td><span class="membership-pill ${status === 'nouveau_adherent' ? 'membership-new' : 'membership-active'}">${esc(membershipNames[status] || status)}</span></td><td><select class="attendance-status" aria-label="Présence de ${esc(row.display_name || row.username)}">${attendanceOptions(a.attendance_status || 'present')}</select></td></tr>`;
      }).join('');
      const clubPresenceRows = clubPresence.map(row => `<div class="pv-club-row" data-school-id="${row.school_id}"><div class="form-field"><label>Club présent</label><select class="club-school"><option value="">Choisir un club</option>${nationalClubOptions(row.school_id)}</select></div><div class="form-field"><label>Représentant BEL</label><select class="club-representative"><option value="">Choisir un représentant</option>${representativeOptions(row.school_id, row.representative_id)}</select></div><button type="button" class="btn btn-quiet btn-sm remove-club">Retirer</button></div>`).join('');
      const localAttendanceMarkup = isNationalMeeting ? '' : `<section class="pv-section"><div class="pv-section-heading"><div><h3>Présence locale</h3><p>Les membres actifs disposent automatiquement du droit de vote local. Les nouveaux adhérents peuvent être présents, mais leur vote n’est pas comptabilisé.</p></div><span class="pv-section-count">${roster.length} membre(s)</span></div><div class="table-wrap"><table class="portal-table pv-attendance-table"><thead><tr><th>Membre</th><th>Statut</th><th>Présence</th></tr></thead><tbody id="attendance-rows">${localAttendanceRows || '<tr><td colspan="3">Aucun membre actif dans ce club.</td></tr>'}</tbody></table></div></section>`;
      const nationalPresenceMarkup = isNationalMeeting ? `<section class="pv-section"><div class="pv-section-heading"><div><h3>Clubs présents</h3><p>Le vote national est porté par les clubs. Chaque club présent doit être représenté par un membre BEL actif.</p></div><span class="pv-section-count" id="club-count">${clubPresence.length} club(s)</span></div><div id="pv-clubs" class="pv-club-list">${clubPresenceRows || '<div class="pv-empty-clubs">Aucun club ajouté pour le moment.</div>'}</div><button type="button" class="btn btn-secondary btn-sm" id="add-club">Ajouter un club présent</button></section>` : '';
      const blocksMarkup = blocks.map((block, index) => `<article class="pv-block pv-editor-row"><div class="pv-block-number">${index + 1}</div><div class="pv-block-fields"><label>Point discuté<input class="block-title" value="${esc(block.title || '')}" placeholder="Titre du point"></label><label>Discussion<textarea class="block-discussion" placeholder="Résumé des échanges">${esc(block.discussion || '')}</textarea></label><label>Conclusion<textarea class="block-decision" placeholder="Décision ou suite à donner">${esc(block.decision || '')}</textarea></label></div></article>`).join('');
      const motionsMarkup = motions.map(motion => `<article class="pv-motion pv-editor-row"><div class="pv-block-fields"><label>Décision ou motion<input class="motion-title" value="${esc(motion.title || '')}" placeholder="Objet de la décision"></label><label>Résultat<textarea class="motion-result" placeholder="Résultat et conséquence">${esc(motion.result || '')}</textarea></label></div></article>`).join('');
      detailRoot.innerHTML = `<section class="portal-card meeting-detail-card pv-editor-shell"><div class="pv-editor-header"><div><span class="pv-kicker">${esc(label[m.meeting_type] || m.meeting_type)}</span><h2>Procès-verbal de ${esc(m.title)}</h2><p>${AYCPortal.formatDate(m.starts_at, true)} · ${esc(m.location || 'Format en ligne')} · ${esc(label[m.status] || m.status || 'Planifiée')}</p></div><button class="btn btn-secondary btn-sm" id="close-detail">Fermer</button></div><div class="pv-summary-grid"><label>Mandat / session<input id="pv-mandate" value="${esc(saved.mandate || '')}" placeholder="Ex. 2026–2027"></label><label>Organisateur·rice<input id="pv-organizer" value="${esc(saved.organizer || '')}" placeholder="Nom de la personne responsable"></label><label>Date de rédaction<input id="pv-drafted" type="date" value="${esc(saved.drafted_at ? saved.drafted_at.slice(0, 10) : '')}"></label><label>Date d’envoi<input id="pv-sent" type="date" value="${esc(saved.sent_at ? saved.sent_at.slice(0, 10) : '')}"></label><label>Statut du PV<select id="pv-status"><option value="draft"${saved.status === 'draft' || !saved.status ? ' selected' : ''}>Brouillon</option><option value="sent"${saved.status === 'sent' ? ' selected' : ''}>Publié</option><option value="validated"${saved.status === 'validated' ? ' selected' : ''}>Validé</option></select></label><label>Durée (minutes)<input id="pv-duration" type="number" min="0" value="${saved.duration_minutes || ''}" placeholder="—"></label></div><div class="pv-editor-toolbar"><div><h3>Procès-verbal</h3><p>Structure les échanges et les décisions sans surcharger la page.</p></div><span class="pv-save-hint">Les règles de vote sont appliquées automatiquement.</span></div>${localAttendanceMarkup}${nationalPresenceMarkup}<section class="pv-section"><div class="pv-section-heading"><div><h3>Points discutés</h3><p>Un bloc par point de l’ordre du jour, avec sa conclusion.</p></div><button type="button" class="btn btn-secondary btn-sm" id="add-block">Ajouter un point</button></div><div id="pv-blocks" class="pv-block-list">${blocksMarkup || '<div class="pv-empty-blocks">Aucun point détaillé pour le moment.</div>'}</div></section><section class="pv-section"><div class="pv-section-heading"><div><h3>Décisions et motions</h3><p>Conserve uniquement le résultat utile à la lecture du PV.</p></div><button type="button" class="btn btn-secondary btn-sm" id="add-motion">Ajouter une décision</button></div><div id="pv-motions" class="pv-motion-list">${motionsMarkup || '<div class="pv-empty-blocks">Aucune décision détaillée pour le moment.</div>'}</div></section><div class="pv-footer-actions"><button class="btn btn-secondary" id="save-pv-draft">Enregistrer le brouillon</button><button class="btn btn-primary" id="save-pv">Enregistrer le PV</button></div></section>`;

      const blocksRoot = document.getElementById('pv-blocks');
      const motionsRoot = document.getElementById('pv-motions');
      const clubsRoot = document.getElementById('pv-clubs');
      const bindClubRow = row => {
        const schoolSelect = row.querySelector('.club-school');
        const repSelect = row.querySelector('.club-representative');
        schoolSelect?.addEventListener('change', () => { repSelect.innerHTML = `<option value="">Choisir un représentant</option>${representativeOptions(schoolSelect.value, '')}`; });
        row.querySelector('.remove-club')?.addEventListener('click', () => { row.remove(); document.getElementById('club-count').textContent = `${clubsRoot.querySelectorAll('.pv-club-row').length} club(s)`; });
      };
      clubsRoot?.querySelectorAll('.pv-club-row').forEach(bindClubRow);
      document.getElementById('add-club')?.addEventListener('click', () => { const row = document.createElement('div'); row.className = 'pv-club-row'; row.innerHTML = `<div class="form-field"><label>Club présent</label><select class="club-school"><option value="">Choisir un club</option>${nationalClubOptions('')}</select></div><div class="form-field"><label>Représentant BEL</label><select class="club-representative"><option value="">Choisir un représentant</option></select></div><button type="button" class="btn btn-quiet btn-sm remove-club">Retirer</button>`; clubsRoot.querySelector('.pv-empty-clubs')?.remove(); clubsRoot.appendChild(row); bindClubRow(row); document.getElementById('club-count').textContent = `${clubsRoot.querySelectorAll('.pv-club-row').length} club(s)`; });
      document.getElementById('add-block').onclick = () => { const div = document.createElement('article'); div.className = 'pv-block pv-editor-row'; div.innerHTML = `<div class="pv-block-number">${blocksRoot.querySelectorAll('.pv-block').length + 1}</div><div class="pv-block-fields"><label>Point discuté<input class="block-title" placeholder="Titre du point"></label><label>Discussion<textarea class="block-discussion" placeholder="Résumé des échanges"></textarea></label><label>Conclusion<textarea class="block-decision" placeholder="Décision ou suite à donner"></textarea></label></div>`; blocksRoot.querySelector('.pv-empty-blocks')?.remove(); blocksRoot.appendChild(div); };
      document.getElementById('add-motion').onclick = () => { const div = document.createElement('article'); div.className = 'pv-motion pv-editor-row'; div.innerHTML = `<div class="pv-block-fields"><label>Décision ou motion<input class="motion-title" placeholder="Objet de la décision"></label><label>Résultat<textarea class="motion-result" placeholder="Résultat et conséquence"></textarea></label></div>`; motionsRoot.querySelector('.pv-empty-blocks')?.remove(); motionsRoot.appendChild(div); };
      const savePV = async statusOverride => {
        const status = statusOverride || document.getElementById('pv-status').value;
        const attendance = isNationalMeeting ? [] : [...document.querySelectorAll('#attendance-rows tr[data-member-id]')].map(row => ({ memberId: row.dataset.memberId, attendanceStatus: row.querySelector('.attendance-status').value }));
        const nationalClubPresence = isNationalMeeting ? [...clubsRoot.querySelectorAll('.pv-club-row')].map(row => ({ schoolId: row.querySelector('.club-school').value, representativeId: row.querySelector('.club-representative').value })).filter(row => row.schoolId && row.representativeId) : [];
        if (isNationalMeeting && status !== 'draft' && !nationalClubPresence.length) { notice.innerHTML = '<div class="alert alert-error">Ajoute au moins un club présent et son représentant BEL avant de publier le PV national.</div>'; return; }
        const agendaBlocks = [...blocksRoot.querySelectorAll('.pv-block')].map(row => ({ title: row.querySelector('.block-title').value.trim(), discussion: row.querySelector('.block-discussion').value.trim(), decision: row.querySelector('.block-decision').value.trim() })).filter(x => x.title);
        const motions = [...motionsRoot.querySelectorAll('.pv-motion')].map(row => ({ title: row.querySelector('.motion-title').value.trim(), result: row.querySelector('.motion-result').value.trim() })).filter(x => x.title);
        try { await AYCPortal.api('meeting', { method: 'POST', body: { action: 'save_minutes', meetingId: m.id, mode: isNationalMeeting ? 'assemblee_generale' : 'standard', status, mandate: document.getElementById('pv-mandate').value, organizer: document.getElementById('pv-organizer').value, draftedAt: document.getElementById('pv-drafted').value || null, sentAt: document.getElementById('pv-sent').value || null, durationMinutes: document.getElementById('pv-duration').value, attendance, clubPresence: nationalClubPresence, agendaBlocks, motions } }); document.getElementById('pv-status').value = status; notice.innerHTML = `<div class="alert alert-success">${status === 'draft' ? 'Le brouillon du PV est enregistré.' : 'Le PV est enregistré et prêt pour sa publication.'}</div>`; } catch (error) { apiError(error); }
      };
      document.getElementById('save-pv-draft').onclick = () => savePV('draft');
      document.getElementById('save-pv').onclick = () => savePV();
      detailRoot.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    try {
      member = await AYCPortal.initPortalShell({ requireActive: true });
      if (!member) return;
      const canCreateMeeting = Boolean(member.access?.canCreateMeeting || member.isNationalAdmin);
      if (!canCreateMeeting) {
        const form = document.getElementById('meeting-form');
        form.hidden = true;
        form.insertAdjacentHTML('beforebegin', '<p class="restricted-note">La publication des réunions est gérée par le Secrétaire Local ou une personne mandatée.</p>');
        document.getElementById('new').querySelector('.eyebrow').textContent = 'Information';
        document.getElementById('new').querySelector('h2').textContent = 'Publication réservée';
        document.getElementById('new').querySelector('.field-hint')?.remove();
      }
      roster = (await AYCPortal.api('roster')).members || [];
      document.getElementById('chairId').innerHTML = memberOptions('');
      document.getElementById('secretaryId').innerHTML = memberOptions('');
      addAgendaRow();
      document.getElementById('add-agenda').onclick = () => addAgendaRow();
      allMeetings = (await AYCPortal.api('meetings')).meetings || [];
      renderMeetings();
      document.getElementById('filters').addEventListener('click', event => { const button = event.target.closest('[data-filter]'); if (!button) return; activeFilter = button.dataset.filter; document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('active', x === button)); renderMeetings(); });
      list.addEventListener('click', async event => { const button = event.target.closest('[data-open]'); if (!button) return; try { renderEditor(await AYCPortal.api('meeting', { query: { meetingId: button.dataset.open } })); } catch (error) { apiError(error); } });
      document.getElementById('meeting-form').addEventListener('submit', async event => { event.preventDefault(); const agendaItems = readAgenda(); if (!agendaItems.length) { notice.innerHTML = '<div class="alert alert-error">Ajoute au moins un point à l’ordre du jour, ou précise pourquoi il n’y en a pas.</div>'; return; } try { await AYCPortal.api('meetings', { method: 'POST', body: { title: fieldValue('title'), meetingType: fieldValue('meetingType'), status: fieldValue('status'), startsAt: fieldValue('startsAt'), endsAt: fieldValue('endsAt'), format: fieldValue('format'), location: fieldValue('location'), mapsUrl: fieldValue('mapsUrl'), chairId: fieldValue('chairId') || null, secretaryId: fieldValue('secretaryId') || null, comments: fieldValue('comments'), agendaItems } }); event.target.reset(); agendaEditor.innerHTML = ''; addAgendaRow(); notice.innerHTML = '<div class="alert alert-success">La réunion a été publiée.</div>'; allMeetings = (await AYCPortal.api('meetings')).meetings || []; renderMeetings(); } catch (error) { apiError(error); } });
    } catch (error) { apiError(error); }
  })();
  </script>
</body>
</html>
