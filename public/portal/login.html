<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion · Portail YOUTHCLUBber</title>
<link rel="icon" type="image/png" href="../assets/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<div class="pattern-veil"></div>
<div id="topbar-root"></div>

<main class="portal-shell" style="max-width:440px;">
  <div class="portal-card" style="text-align:center;">
    <h1 class="portal-title">Portail YOUTHCLUBber</h1>
    <p class="portal-subtitle">Réservé aux membres. Connecte-toi avec le compte Google que ton club a enregistré.</p>

    <p id="error-msg" class="field-error" style="display:none; margin-bottom:16px;"></p>

    <a href="/api/auth/google/start" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.8 2.73v2.27h2.92c1.71-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.97H.96A8.99 8.99 0 0 0 0 9c0 1.45.35 2.83.96 4.03l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.97l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continuer avec Google
    </a>
  </div>
</main>

<script src="portal-common.js"></script>
<script>
  (async function () {
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    if (error) {
      const messages = {
        google_denied: "La connexion Google a été annulée.",
        bad_state: "La session de connexion a expiré, réessaie.",
        auth_failed: "La connexion a échoué, réessaie.",
      };
      const el = document.getElementById("error-msg");
      el.textContent = messages[error] || "Une erreur est survenue.";
      el.style.display = "block";
    }

    // Paints the topbar and, if already signed in, tells us so we can
    // skip straight past the login screen.
    const member = await window.AYCPortal.initPortalShell();
    if (member) {
      if (member.status === "active") window.location.href = "home.html";
      else if (member.status === "pending") window.location.href = "pending.html";
      else if (member.status === "rejected") window.location.href = "rejected.html";
    }
  })();
</script>
</body>
</html>
