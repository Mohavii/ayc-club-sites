<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demande en attente · Portail YOUTHCLUBber</title>
<link rel="icon" type="image/png" href="../assets/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<div class="pattern-veil"></div>
<div id="topbar-root"></div>

<main class="portal-shell" style="max-width:480px;">
  <div class="portal-card" style="text-align:center;">
    <h1 class="portal-title">Demande envoyée</h1>
    <div class="status-banner pending">
      Ta demande d'adhésion est en attente d'approbation par ton club. Tu recevras un e-mail dès qu'une décision sera prise.
    </div>
    <p class="portal-subtitle" style="margin-bottom:0;">Tu peux fermer cette page — reviens ici quand tu veux pour vérifier l'état de ta demande.</p>
  </div>
</main>

<script src="portal-common.js"></script>
<script>
(async function () {
  const member = await window.AYCPortal.initPortalShell();
  if (!member) {
    window.location.href = "login";
    return;
  }
  if (member.status === "active") window.location.href = "home";
  if (member.status === "rejected") window.location.href = "rejected";
})();
</script>
</body>
</html>
