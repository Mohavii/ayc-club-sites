<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mon profil · Portail YOUTHCLUBber</title>
  <link rel="icon" href="../assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <div id="topbar-root"></div>
  <div class="workspace">
    <div id="sidebar-root"></div>
    <main class="portal-content">
      <div class="portal-heading">
        <div>
          <p class="eyebrow">Espace personnel</p>
          <h1>Mon profil</h1>
          <p>Une fiche claire pour ton identité, ton statut et ton parcours YOUTHCLUBber.</p>
        </div>
        <div class="heading-actions">
          <a class="btn btn-secondary" href="home">Retour au tableau de bord</a>
        </div>
      </div>
      <div id="notice"></div>
      <div id="profile-root">
        <div class="empty-state"><strong>Chargement du profil…</strong><span>Quelques instants.</span></div>
      </div>
    </main>
  </div>

  <script src="portal-common.js"></script>
  <script>
  (async () => {
    const root = document.getElementById('profile-root');
    const notice = document.getElementById('notice');
    const esc = AYCPortal.escapeHtml;
    const roleNames = {
      president: 'Président local', tresorier: 'Trésorier local', secretaire: 'Secrétaire local',
      vpi: 'VPI', vpe: 'VPE', vpc: 'VPC', supco_regional: 'SupCo régional',
      president_national: 'Président national'
    };
    const statusNames = {
      nouveau_adherent: 'Nouveau adhérent', adherent: 'Adhérent / membre', responsable: 'Responsable',
      senior: 'Senior', membre_national: 'Membre national', ancien: 'Ancien'
    };
    try {
      const sessionMember = await AYCPortal.initPortalShell({ requireActive: true });
      if (!sessionMember) return;
      const isSimpleMember = Boolean(sessionMember.access?.isOrdinaryMember || sessionMember.access?.isNewAdherent);
      const data = await AYCPortal.api('profile');
      const m = data.member || sessionMember;
      const initials = (m.display_name || m.displayName || '').split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase();
      const avatar = m.profile_picture_url
        ? `<img class="profile-large-avatar" src="${esc(m.profile_picture_url)}" alt="Photo de profil">`
        : `<span class="profile-large-avatar">${esc(initials)}</span>`;
      const currentRoles = (data.roles || []).filter(r => !r.ended_at);
      // Repeated clicks on a role chip (e.g. re-saving the same role) can
      // insert several rows that are functionally identical — same role,
      // same club, same start/end. Those are display noise, not real
      // history, so we collapse exact duplicates. A club role held twice
      // over genuinely different periods (e.g. re-elected the next year)
      // still shows both rows, since only the started_at differs.
      const dedupeRoleRows = rows => {
        const seen = new Set();
        return rows.filter(r => {
          const key = [r.role, r.school_id ?? '', r.started_at, r.ended_at ?? ''].join('|');
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      };
      const history = dedupeRoleRows(data.roles || []).map(r => `
        <div class="list-item">
          <div class="list-item-main">
            <span class="list-item-title">${esc(roleNames[r.role] || r.role)}</span>
            <span class="list-item-meta">${esc(r.school_name || 'Organisation nationale')} · ${AYCPortal.formatDate(r.started_at)} — ${r.ended_at ? AYCPortal.formatDate(r.ended_at) : 'actuel'}</span>
          </div>
          <span class="status-badge ${!r.ended_at ? 'status-active' : ''}">${r.ended_at ? 'Terminé' : 'Actuel'}</span>
        </div>`).join('');
      const capabilities = (data.capabilities || []).map(c => `<span class="role-badge">${esc(c.capability.replaceAll('_', ' '))} · ${esc(c.school_name || 'club')}</span>`).join('');
      // Same idea for the membership-status timeline: collapse consecutive
      // entries that carry the same status, since re-clicking "save" on an
      // unchanged status shouldn't read as a new event in the history.
      const rawStatusHistory = (data.statusHistory || []).slice().sort((a, b) => new Date(b.changed_at) - new Date(a.changed_at));
      const dedupedStatusHistory = rawStatusHistory.filter((h, i) => i === 0 || h.status !== rawStatusHistory[i - 1].status);
      const statusHistory = dedupedStatusHistory.map(h => `
        <div class="list-item">
          <div class="list-item-main">
            <span class="list-item-title">${esc(statusNames[h.status] || h.status)}</span>
            <span class="list-item-meta">${AYCPortal.formatDate(h.changed_at)}${h.changed_by_name ? ` · par ${esc(h.changed_by_name)}` : ''}</span>
          </div>
          ${h.reason ? `<span class="list-item-meta">${esc(h.reason)}</span>` : ''}
        </div>`).join('');
      const status = m.membership_status || 'nouveau_adherent';
      const trainer = data.trainerProfile;
      const awards = Array.isArray(data.awards) ? data.awards : [];
      const documents = Array.isArray(data.documents) ? data.documents : [];
      const documentLabels = { candidature: 'Candidature', training_evidence: 'Preuve de formation', trainer_certificate: 'Certificat Formateur', award_evidence: 'Justificatif de distinction', other: 'Autre document' };

      root.innerHTML = `
        <section class="portal-card card-span-12 profile-dossier-card">
          <div class="profile-cover" id="profile-cover"></div>
          <div class="profile-header">
            ${avatar}
            <div>
              <p class="eyebrow">Dossier membre</p>
              <h2>${esc(m.display_name || m.displayName || 'Membre')}</h2>
              <p>@${esc(m.username || '')} · ${esc(m.school_name || 'Association YOUTH CLUBs')}</p>
              <div class="role-badges">
                <span class="role-badge">${esc(statusNames[status] || status)}</span>
                ${currentRoles.map(r => `<span class="role-badge">${esc(roleNames[r.role] || r.role)}</span>`).join('') || '<span class="role-badge">Parcours à compléter</span>'}
              </div>
            </div>
          </div>
        </section>

        <div class="portal-grid" style="margin-top:18px">
          <section class="portal-card card-span-6">
            <div class="toolbar"><h2>Coordonnées</h2><span class="status-badge status-active">Profil actif</span></div>
            <div class="list-stack">
              <div class="list-item"><div class="list-item-main"><span class="list-item-meta">Adresse e-mail</span><span class="list-item-title">${esc(m.email || '—')}</span></div></div>
              <div class="list-item"><div class="list-item-main"><span class="list-item-meta">Téléphone</span><span class="list-item-title">${esc(m.phone || 'Non renseigné')}</span></div></div>
              <div class="list-item"><div class="list-item-main"><span class="list-item-meta">Niveau d'études</span><span class="list-item-title">${esc(m.education_level || 'Non renseigné')}</span></div></div>
              <div class="list-item"><div class="list-item-main"><span class="list-item-meta">Club / établissement</span><span class="list-item-title">${esc(m.school_name || '—')}</span></div></div>
            </div>
          </section>

          <section class="portal-card card-span-6" id="settings">
            <h2>Mes informations</h2>
            <form id="profile-form">
              <div class="form-field"><label for="phone">Téléphone</label><input id="phone" maxlength="80" value="${esc(m.phone || '')}" placeholder="+216 …"></div>
              <div class="form-field"><label for="educationLevel">Niveau d'études</label><input id="educationLevel" maxlength="160" value="${esc(m.education_level || '')}" placeholder="Ex. 3ème année secondaire"></div>
              <div class="form-field"><label for="coverPhotoUrl">Lien de couverture (HTTPS)</label><input id="coverPhotoUrl" type="url" value="${esc(m.cover_photo_url || '')}" placeholder="https://…"></div>
              <div class="form-field"><label for="bio">Présentation</label><textarea id="bio" maxlength="2000" placeholder="Quelques mots sur ton parcours…">${esc(m.bio || '')}</textarea></div>
              <div class="form-actions"><button class="btn btn-primary" type="submit">Enregistrer mes informations</button></div>
            </form>
          </section>

          ${isSimpleMember ? '' : `<section class="portal-card card-span-6">
            <h2>Responsabilités actuelles</h2>
            <div class="role-badges">${capabilities || '<span class="list-item-meta">Aucune capacité particulière attribuée.</span>'}</div>
            <div class="quote-block" style="margin-top:20px">Les capacités sont attribuées individuellement par les admins nationaux et ne sont jamais déduites d'un titre général.</div>
          </section>`}

          <section class="portal-card card-span-6">
            <h2>Statut d'adhésion</h2>
            <p class="list-item-meta">Ton statut officiel et son historique sont distincts de ton accès technique au portail.</p>
            <div class="status-badge status-active" style="margin:10px 0 14px">${esc(statusNames[status] || status)}</div>
            <div class="list-stack">${statusHistory || '<div class="empty-state">Aucun changement de statut enregistré.</div>'}</div>
          </section>

          ${isSimpleMember ? '' : `<section class="portal-card card-span-8">
            <h2>Historique des postes occupés</h2>
            <div class="list-stack">${history || AYCPortal.renderEmpty('Aucun poste officiel enregistré')}</div>
          </section>`}

          <section class="portal-card card-span-4">
            <h2>Dossier de candidature</h2>
            <p class="list-item-meta">Les documents de candidature sont visibles par les membres actifs. Les preuves privées restent réservées à ton dossier et aux admins nationaux.</p>
            <div class="list-stack" style="margin:14px 0">${documents.filter(d => d.document_type === 'candidature').map(d => `<div class="list-item"><div class="list-item-main"><span class="list-item-title">${esc(d.title)}</span><span class="list-item-meta">${esc(d.status || 'en attente')}</span></div><a class="btn btn-secondary btn-sm" href="/api/portal?action=document_download&id=${encodeURIComponent(d.id)}">Voir</a></div>`).join('') || '<span class="list-item-meta">Aucun document de candidature.</span>'}</div>
            <a class="btn btn-secondary btn-sm" href="training">Gérer mon dossier</a>
          </section>

          ${!isSimpleMember && (m.formateur_track || trainer) ? `<section class="portal-card card-span-8 red-theme"><div class="toolbar"><div><p class="eyebrow">Transmission</p><h2>Portfolio Formateur</h2></div><a class="btn btn-secondary btn-sm" href="training">Ouvrir mon portfolio</a></div><div class="quote-block">${esc(trainer?.oath_text || 'Transmettre, faciliter et faire grandir les équipes avec exigence et bienveillance.')}</div><div class="role-badges">${(trainer?.expertise_domains || []).map(x => `<span class="role-badge">${esc(x)}</span>`).join('') || '<span class="list-item-meta">Domaines d’expertise à renseigner</span>'}</div></section>` : ''}

          ${isSimpleMember ? '' : `<section class="portal-card card-span-4"><h2>Valeurs & distinctions</h2><div class="list-stack">${awards.slice(0, 4).map(a => `<div class="list-item"><div class="list-item-main"><span class="list-item-title">${esc(a.title)}</span><span class="list-item-meta">${esc(a.issuer || 'Association YOUTH CLUBs')} · ${AYCPortal.formatDate(a.awarded_on)}</span></div></div>`).join('') || '<span class="list-item-meta">Aucune distinction enregistrée.</span>'}</div></section>`}
        </div>`;

      if (m.cover_photo_url) document.getElementById('profile-cover').style.backgroundImage = `url("${m.cover_photo_url.replace(/"/g, '')}")`;
      document.getElementById('profile-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const value = id => document.getElementById(id).value;
        try {
          await AYCPortal.api('update_profile', { method: 'POST', body: {
            phone: value('phone'), educationLevel: value('educationLevel'), bio: value('bio'), coverPhotoUrl: value('coverPhotoUrl')
          }});
          notice.innerHTML = '<div class="alert alert-success">Tes informations ont été enregistrées.</div>';
          setTimeout(() => { notice.innerHTML = ''; }, 4500);
        } catch (error) { AYCPortal.renderError(notice, error); }
      });
    } catch (error) { AYCPortal.renderError(root, error); }
  })();
  </script>
</body>
</html>
