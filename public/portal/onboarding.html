<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compléter mon profil · Portail YOUTHCLUBber</title>
<link rel="icon" type="image/png" href="../assets/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<div class="pattern-veil"></div>
<div id="topbar-root"></div>

<main class="portal-shell">
  <div class="portal-card">
    <h1 class="portal-title">Complète ton profil</h1>
    <p class="portal-subtitle">Dernière étape avant que ta demande soit envoyée à ton club pour validation.</p>

    <form id="onboarding-form" novalidate>
      <div class="avatar-upload">
        <img id="avatar-preview" class="avatar-preview" src="" alt="Aperçu de la photo de profil">
        <div>
          <label class="btn btn-third" for="avatar-input" style="padding:10px 18px; font-size:0.85rem;">Choisir une photo</label>
          <input type="file" id="avatar-input" accept="image/png,image/jpeg,image/webp">
          <div id="avatar-status" class="field-hint">Ta photo Google est utilisée par défaut. JPEG, PNG ou WEBP, 4 Mo max.</div>
        </div>
      </div>

      <div class="field">
        <label for="displayName">Nom affiché</label>
        <input type="text" id="displayName" maxlength="120" placeholder="ex. Mohamed Eslem Besbes" required>
      </div>

      <div class="field">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" maxlength="24" placeholder="ex. eslem_b" required>
        <div id="username-feedback" class="field-hint">3 à 24 caractères : lettres minuscules, chiffres, underscore.</div>
      </div>

      <div class="field">
        <label for="school">École / club</label>
        <select id="school" required>
          <option value="">Choisir…</option>
        </select>
      </div>

      <p id="form-error" class="field-error" style="display:none;"></p>

      <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%; justify-content:center;">
        Envoyer ma demande
      </button>
    </form>
  </div>
</main>

<script src="portal-common.js"></script>
<script>
(async function () {
  await window.AYCPortal.initPortalShell();

  // Confirm we actually have an in-progress signup (signup-token cookie).
  // If not, this page shouldn't be reachable directly.
  let prefill;
  try {
    const res = await fetch("/api/onboarding/me");
    if (!res.ok) throw new Error("no signup session");
    prefill = await res.json();
  } catch {
    window.location.href = "login.html?error=auth_failed";
    return;
  }

  const displayNameInput = document.getElementById("displayName");
  const usernameInput = document.getElementById("username");
  const usernameFeedback = document.getElementById("username-feedback");
  const schoolSelect = document.getElementById("school");
  const avatarInput = document.getElementById("avatar-input");
  const avatarPreview = document.getElementById("avatar-preview");
  const avatarStatus = document.getElementById("avatar-status");
  const formError = document.getElementById("form-error");
  const submitBtn = document.getElementById("submit-btn");

  displayNameInput.value = prefill.suggestedName || "";
  let selectedPictureUrl = prefill.googlePicture || null;
  avatarPreview.src = selectedPictureUrl || "/assets/logo-secondary-color.png";
  if (selectedPictureUrl) avatarStatus.textContent = "Photo Google prête — tu peux la remplacer.";

  // ---- schools ----
  try {
    const res = await fetch("/api/schools");
    const data = await res.json();
    for (const s of data.schools) {
      const opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = s.name;
      schoolSelect.appendChild(opt);
    }
  } catch {
    schoolSelect.innerHTML = '<option value="">Impossible de charger la liste</option>';
  }

  // ---- live username check ----
  let usernameOk = false;
  let usernameCheckTimer = null;
  usernameInput.addEventListener("input", () => {
    usernameOk = false;
    clearTimeout(usernameCheckTimer);
    const value = usernameInput.value.trim().toLowerCase();
    if (!value) {
      usernameFeedback.textContent = "3 à 24 caractères : lettres minuscules, chiffres, underscore.";
      usernameFeedback.className = "field-hint";
      return;
    }
    usernameCheckTimer = setTimeout(async () => {
      try {
        const res = await fetch(`/api/onboarding/check-username?u=${encodeURIComponent(value)}`);
        const data = await res.json();
        usernameOk = !!data.available;
        usernameFeedback.textContent = data.available ? "Disponible." : (data.reason || "Indisponible.");
        usernameFeedback.className = data.available ? "field-ok" : "field-error";
      } catch {
        usernameFeedback.textContent = "Impossible de vérifier pour le moment.";
        usernameFeedback.className = "field-error";
      }
    }, 400);
  });

  // ---- avatar upload ----
  // The file's bytes are POSTed straight to our own function, which
  // stores them in Vercel Blob server-side and hands back the public URL.
  avatarInput.addEventListener("change", async () => {
    const file = avatarInput.files && avatarInput.files[0];
    if (!file) return;

    const allowedTypes = ["image/jpeg", "image/png", "image/webp"];
    if (!allowedTypes.includes(file.type)) {
      avatarStatus.textContent = "Format non supporté. Choisis un JPEG, PNG ou WEBP.";
      avatarPreview.src = selectedPictureUrl || "/assets/logo-secondary-color.png";
      return;
    }
    if (!file.size) {
      avatarStatus.textContent = "Le fichier est vide ou illisible. La photo Google reste sélectionnée.";
      avatarPreview.src = selectedPictureUrl || "/assets/logo-secondary-color.png";
      return;
    }
    if (file.size > 4 * 1024 * 1024) {
      avatarStatus.textContent = "Image trop lourde (4 Mo max). La photo Google reste sélectionnée.";
      avatarPreview.src = selectedPictureUrl || "/assets/logo-secondary-color.png";
      return;
    }

    const preview = URL.createObjectURL(file);
    avatarPreview.src = preview;
    avatarStatus.textContent = "Téléversement…";

    try {
      const res = await fetch("/api/onboarding/upload-photo", {
        method: "POST",
        headers: { "Content-Type": file.type },
        body: file,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Échec du téléversement.");
      selectedPictureUrl = data.url;
      avatarStatus.textContent = "Photo personnelle téléversée.";
    } catch (err) {
      avatarPreview.src = selectedPictureUrl || "/assets/logo-secondary-color.png";
      avatarStatus.textContent = `${err.message || "Échec du téléversement."} La photo Google reste sélectionnée.`;
    } finally {
      URL.revokeObjectURL(preview);
    }
  });

  // ---- submit ----
  document.getElementById("onboarding-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    formError.style.display = "none";

    if (!usernameOk) {
      formError.textContent = "Choisis un nom d'utilisateur disponible avant de continuer.";
      formError.style.display = "block";
      return;
    }
    if (!schoolSelect.value) {
      formError.textContent = "Choisis ton école / club.";
      formError.style.display = "block";
      return;
    }
    if (!selectedPictureUrl) {
      formError.textContent = "Aucune photo disponible. Choisis une photo ou reconnecte-toi avec Google.";
      formError.style.display = "block";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Envoi…";
    try {
      const res = await fetch("/api/onboarding/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: usernameInput.value.trim().toLowerCase(),
          displayName: displayNameInput.value.trim(),
          schoolId: Number(schoolSelect.value),
          profilePictureUrl: selectedPictureUrl,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Échec de l'envoi.");
      window.location.href = "pending.html";
    } catch (err) {
      formError.textContent = err.message;
      formError.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Envoyer ma demande";
    }
  });
})();
</script>
</body>
</html>
