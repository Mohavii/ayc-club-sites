<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes tâches · Portail YOUTHCLUBber</title><link rel="icon" href="../assets/favicon-32.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="portal.css"></head>
<body><div id="topbar-root"></div><div class="workspace"><div id="sidebar-root"></div><main class="portal-content"><div class="portal-heading"><div><p class="eyebrow">Organisation personnelle</p><h1>Mes tâches</h1><p>Un journal clair de ce qui t'est assigné, de tes échéances et de ce que tu dois soumettre.</p></div></div><div id="notice"></div>
<section class="portal-card task-journal">
  <div class="task-journal-banner"><h2>Journal des tâches</h2></div>
  <div class="task-journal-toolbar"><h3>&nbsp;</h3><div class="filter-tabs"><button class="active" data-filter="all">Toutes</button><button data-filter="a_faire">À faire</button><button data-filter="soumis">Soumises</button><button data-filter="executee">Exécutées</button><button data-filter="hors_delai">Hors délai</button></div></div>
  <div class="task-table-wrap"><table class="task-table"><thead><tr><th>ID de la tâche</th><th>Projet correspondant</th><th>Description de la tâche</th><th>Priorité</th><th>Assignée le</th><th>Délai limite</th><th>Statut</th><th>Commentaires</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
<div id="modal-root"></div>
</main></div>
<script src="portal-common.js"></script><script>
(async () => {
  const rowsEl = document.getElementById('rows');
  const notice = document.getElementById('notice');
  const modalRoot = document.getElementById('modal-root');
  const esc = AYCPortal.escapeHtml;
  const priorityLabel = { basse: 'Faible', normale: 'Moyenne', haute: 'Elevée', urgente: 'Urgente' };
  let all = [];
  let member;

  function openSubmitModal(task) {
    modalRoot.innerHTML = `<div class="task-modal-backdrop" id="modal-backdrop"><div class="task-modal"><h3>Soumettre la tâche</h3><p>${esc(task.title)}${task.project_title ? ` · ${esc(task.project_title)}` : ''}</p><div class="form-field"><label for="submission-note">Note de soumission</label><textarea id="submission-note" placeholder="Lien, précisions ou contexte pour cette soumission…">${esc(task.submission_note || '')}</textarea></div><div class="form-actions"><button class="btn btn-secondary" id="modal-cancel">Annuler</button><button class="btn btn-primary" id="modal-submit">Soumettre</button></div></div></div>`;
    const close = () => { modalRoot.innerHTML = ''; };
    document.getElementById('modal-backdrop').addEventListener('click', e => { if (e.target.id === 'modal-backdrop') close(); });
    document.getElementById('modal-cancel').onclick = close;
    document.getElementById('modal-submit').onclick = async () => {
      const submissionNote = document.getElementById('submission-note').value.trim();
      try {
        await AYCPortal.api('tasks', { method: 'POST', body: { action: 'status', taskId: task.id, status: 'soumis', submissionNote } });
        const found = all.find(t => t.id === task.id);
        if (found) { found.status = 'soumis'; found.submission_note = submissionNote; }
        close();
        notice.innerHTML = '<div class="alert alert-success">La tâche a été soumise.</div>';
        render(currentFilter());
      } catch (error) { close(); AYCPortal.renderError(notice, error); }
    };
  }

  function currentFilter() { return document.querySelector('[data-filter].active')?.dataset.filter || 'all'; }

  function statusCell(t) {
    if (t.status === 'executee') return `<span class="task-pill pill-executee">Exécutée</span>`;
    if (t.status === 'hors_delai') return `<span class="task-pill pill-hors_delai">Hors deadline</span>`;
    return `<button type="button" class="task-pill pill-soumis" data-submit="${t.id}">${t.status === 'soumis' ? 'Soumise ▾' : 'Soumettre ▾'}</button>`;
  }

  function render(filter) {
    const rows = filter === 'all' ? all : all.filter(t => t.status === filter);
    rowsEl.innerHTML = rows.length ? rows.map(t => `<tr>
      <td><strong>#${esc(t.id.slice(0, 8))}</strong></td>
      <td>${esc(t.project_title || 'Sans projet')}</td>
      <td><strong>${esc(t.title)}</strong>${t.description ? `<br><small>${esc(t.description)}</small>` : ''}</td>
      <td>${esc(priorityLabel[t.priority] || t.priority)}</td>
      <td>${AYCPortal.formatDate(t.assigned_at)}</td>
      <td>${t.deadline ? AYCPortal.formatDate(t.deadline) : '—'}</td>
      <td>${statusCell(t)}</td>
      <td>${esc(t.comments || '—')}</td>
    </tr>`).join('') : `<tr class="task-empty-row"><td colspan="8"><strong>Aucune tâche assignée</strong>Les éléments apparaîtront ici dès qu'ils seront créés.</td></tr>`;
    rowsEl.querySelectorAll('[data-submit]').forEach(btn => btn.onclick = () => {
      const task = all.find(t => t.id === btn.dataset.submit);
      if (task) openSubmitModal(task);
    });
  }

  try {
    member = await AYCPortal.initPortalShell({ requireActive: true });
    if (!member) return;
    all = (await AYCPortal.api('tasks')).tasks || [];
    render('all');
    document.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('[data-filter]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      render(b.dataset.filter);
    }));
  } catch (e) { AYCPortal.renderError(notice, e); }
})();
</script></body></html>
