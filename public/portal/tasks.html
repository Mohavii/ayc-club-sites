<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes tâches · Portail YOUTHCLUBber</title><link rel="icon" href="../assets/favicon-32.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="portal.css"></head>
<body><div id="topbar-root"></div><div class="workspace"><div id="sidebar-root"></div><main class="portal-content"><div class="portal-heading"><div><p class="eyebrow">Organisation personnelle</p><h1>Mes tâches</h1><p>Un journal clair de ce qui t'est assigné, de tes échéances et de ce que tu dois soumettre.</p></div></div><div id="notice"></div><section class="portal-card"><div class="toolbar"><h2>Journal des tâches</h2><div class="filter-tabs"><button class="active" data-filter="all">Toutes</button><button data-filter="a_faire">À faire</button><button data-filter="soumis">Soumises</button><button data-filter="executee">Exécutées</button><button data-filter="hors_delai">Hors délai</button></div></div><div class="table-wrap"><table class="portal-table"><thead><tr><th>ID / projet</th><th>Description</th><th>Priorité</th><th>Échéance</th><th>Statut</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div>
<script src="portal-common.js"></script><script>
(async()=>{const rowsEl=document.getElementById('rows');let all=[];try{const m=await AYCPortal.initPortalShell({requireActive:true});if(!m)return;const render=filter=>{const rows=filter==='all'?all:all.filter(t=>t.status===filter);rowsEl.innerHTML=rows.length?rows.map(t=>`<tr><td><strong>#${t.id.slice(0,8)}</strong><br><small>${AYCPortal.escapeHtml(t.project_title||'Sans projet')}</small></td><td><strong>${AYCPortal.escapeHtml(t.title)}</strong><br><small>${AYCPortal.escapeHtml(t.description||'')}</small></td><td>${AYCPortal.escapeHtml(t.priority)}</td><td>${AYCPortal.formatDate(t.deadline)}</td><td><span class="status-badge status-${t.status}">${AYCPortal.statusLabel(t.status)}</span></td><td><select class="task-status" data-id="${t.id}"><option value="a_faire" ${t.status==='a_faire'?'selected':''}>À faire</option><option value="soumis" ${t.status==='soumis'?'selected':''}>Soumis</option><option value="executee" ${t.status==='executee'?'selected':''}>Exécutée</option><option value="hors_delai" ${t.status==='hors_delai'?'selected':''}>Hors délai</option></select></td></tr>`).join(''):`<tr><td colspan="6">${AYCPortal.renderEmpty('Aucune tâche assignée')}</td></tr>`};all=(await AYCPortal.api('tasks')).tasks||[];render('all');document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)}));rowsEl.addEventListener('change',async e=>{if(!e.target.classList.contains('task-status'))return;try{await AYCPortal.api('tasks',{method:'POST',body:{action:'status',taskId:e.target.dataset.id,status:e.target.value}});const found=all.find(t=>t.id===e.target.dataset.id);if(found)found.status=e.target.value;render('all')}catch(err){AYCPortal.renderError(document.getElementById('notice'),err)}})}catch(e){AYCPortal.renderError(document.getElementById('notice'),e)}})();
</script></body></html>
