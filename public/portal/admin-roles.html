<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion des rôles · Portail YOUTHCLUBber</title>
<link rel="icon" type="image/png" href="../assets/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<div class="pattern-veil"></div>
<div id="topbar-root"></div>

<main class="portal-shell wide">
  <div class="portal-card">
    <h1 class="portal-title">Gestion des rôles</h1>
    <p class="portal-subtitle">Attribuez les rôles d'affichage (Président, Secrétaire…), les capacités
      internes (validation de rapports, édition des PV…) et les rôles nationaux. Réservé aux admins
      nationaux.</p>

    <div id="tab-clubs">
      <div class="field" style="max-width:360px;">
        <label for="school-select">Club</label>
        <select id="school-select"><option value="">Choisissez un club…</option></select>
      </div>

      <div class="role-two-col" id="two-col" style="display:none;">
        <div class="role-col-members">
          <div class="role-section-label">Membres actifs</div>
          <div id="member-list"></div>
        </div>

        <div class="role-col-detail" id="detail-panel">
          <div class="empty-state">Sélectionnez un membre à gauche.</div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="portal-common.js"></script>
<script>
(async function () {
  const member = await window.AYCPortal.initPortalShell();
  if (!member) { window.location.href = "login"; return; }
  if (member.status !== "active" || !member.isNationalAdmin) {
    window.location.href = "home";
    return;
  }

  const DISPLAY_ROLES = [
    { value: "president", label: "Président" },
    { value: "tresorier", label: "Trésorier" },
    { value: "secretaire", label: "Secrétaire" },
    { value: "vpi", label: "VPI" },
    { value: "vpe", label: "VPE" },
    { value: "vpc", label: "VPC" },
    { value: "supco_regional", label: "SupCo Régional" },
  ];
  const CAPABILITIES = [
    { value: "membership_approver", label: "Approbateur d'adhésions" },
    { value: "report_validator", label: "Validateur de rapports" },
    { value: "pv_editor", label: "Éditeur de PV" },
    { value: "meeting_organizer", label: "Organisateur de réunions" },
    { value: "project_manager", label: "Responsable de projets" },
    { value: "supervision_editor", label: "Responsable de supervision" },
    { value: "cscy_reviewer", label: "Référent CSCY" },
  ];
  const NATIONAL_ROLES = [
    { value: "president_national", label: "Président National" },
    { value: "secretaire_general_national", label: "Secrétaire Générale Nationale" },
    { value: "tresorier_national", label: "Trésorier National" },
    { value: "vpa", label: "VPA" },
    { value: "vpr", label: "VPR" },
    { value: "vpcom", label: "VPCOM" },
    { value: "supco_national", label: "SUPCO (Conseil de Supervision)" },
    { value: "secretaire_national", label: "Secrétaire National (rédaction des PV d’AG)" },
  ];
  const EPN_ROLES = [
    { value: "epn_president", label: "Président" },
    { value: "epn_vice_president", label: "Vice-Président" },
    { value: "epn_secretaire", label: "Secrétaire de la Plénière" },
    { value: "epn_cscy", label: "CSCY" },
    { value: "epn_comite_financier", label: "Comité Financier" },
  ];
  const EPL_ROLES = [
    { value: "epl_president", label: "Président" },
    { value: "epl_vice_president", label: "Vice-Président" },
    { value: "epl_secretaire", label: "Secrétaire de la Plénière" },
    { value: "epl_cscy", label: "CSCY" },
    { value: "epl_comite_financier", label: "Comité Financier" },
  ];
  const NATIONAL_CAPABILITIES = [{ value: "national_projects", label: "Créer et piloter des projets nationaux" }];
  const MEMBERSHIP_STATUSES = [
    { value: "nouveau_adherent", label: "Nouveau adhérent" },
    { value: "adherent", label: "Adhérent / membre" },
    { value: "responsable", label: "Responsable" },
    { value: "senior", label: "Senior" },
    { value: "membre_national", label: "Membre national" },
    { value: "ancien", label: "Ancien" },
  ];

  const schoolSelect = document.getElementById("school-select");
  const twoCol = document.getElementById("two-col");
  const memberListEl = document.getElementById("member-list");
  const detailPanel = document.getElementById("detail-panel");
  const esc = window.AYCPortal.escapeHtml;
  let schools = [];
  let currentSchoolId = null;
  let currentMemberId = null;

  async function callRoles(body) {
    const res = await fetch("/api/admin/roles", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Échec de la requête.");
    return data;
  }

  async function loadSchools() {
    const data = await callRoles({ action: "browse" });
    schools = data.schools;
    schoolSelect.innerHTML =
      '<option value="">Choisissez un club…</option>' +
      schools.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
  }

  async function loadMembers(schoolId) {
    memberListEl.innerHTML = '<div class="empty-state">Chargement…</div>';
    const data = await callRoles({ action: "browse", schoolId });
    if (data.members.length === 0) {
      memberListEl.innerHTML = '<div class="empty-state">Aucun membre actif dans ce club.</div>';
      return;
    }
    memberListEl.innerHTML = "";
    for (const m of data.members) {
      const row = document.createElement("div");
      row.className = "member-pick-row";
      row.dataset.id = m.id;
      row.innerHTML = `
        ${m.profilePictureUrl ? `<img src="${m.profilePictureUrl}" alt="">` : `<img src="../assets/logo-secondary-color.png" alt="">`}
        <div class="who">
          <strong>${esc(m.displayName)}</strong>
          <span>@${esc(m.username)}</span>
        </div>
      `;
      row.addEventListener("click", () => selectMember(m.id, row));
      memberListEl.appendChild(row);
    }
  }

  async function selectMember(memberId, rowEl) {
    currentMemberId = memberId;
    memberListEl.querySelectorAll(".member-pick-row").forEach((r) => r.classList.remove("active"));
    rowEl.classList.add("active");
    await renderDetail();
  }

  // ---- Équipe Plénière Locale (EPL) --------------------------------------
  // Unlike every other section on this page, EPL isn't about the member
  // selected on the left — it's "who from OTHER clubs sits on THIS
  // club's plenary team". So it keeps its own small bit of state (the
  // current search results) and re-renders itself independently after
  // every grant/revoke, rather than depending on currentMemberId at all.
  let eplSearchResults = [];

  function renderEplSection(currentEplMembers) {
    const byRole = new Map();
    for (const m of currentEplMembers) {
      if (!byRole.has(m.role)) byRole.set(m.role, []);
      byRole.get(m.role).push(m);
    }
    const rosterHtml = EPL_ROLES.map((r) => {
      const holders = byRole.get(r.value) || [];
      return `<div class="history-row" data-epl-roster-role="${r.value}">
        <span class="role-name">${r.label}</span>
        <span class="dates">${
          holders.length
            ? holders.map((h) => `${esc(h.displayName)} (@${esc(h.username)}) <button type="button" class="role-chip" data-epl-remove="${r.value}" data-epl-remove-member="${h.id}" style="color:#B23A3A;padding:1px 8px;margin-left:6px;">Retirer</button>`).join(" · ")
            : '<span class="field-hint" style="margin:0;">Vacant</span>'
        }</span>
      </div>`;
    }).join("");

    return `
      <div class="list-stack" style="margin-bottom:12px;">${rosterHtml}</div>
      <div class="form-grid" style="align-items:end; margin-bottom:8px;">
        <div class="form-field" style="grid-column:1/-1;">
          <label for="epl-search">Chercher un membre à ajouter (nom ou @identifiant, hors membres de ce club)</label>
          <input id="epl-search" placeholder="Tapez un nom…" autocomplete="off">
        </div>
      </div>
      <div id="epl-search-results" class="list-stack" style="margin-bottom:6px;"></div>
    `;
  }

  async function runEplSearch(query, schoolId) {
    const resultsEl = document.getElementById("epl-search-results");
    if (!resultsEl) return;
    const q = query.trim();
    if (!q) { resultsEl.innerHTML = ""; eplSearchResults = []; return; }
    resultsEl.innerHTML = '<div class="empty-state">Recherche…</div>';
    const data = await callRoles({ action: "searchMembers", query: q });
    // The whole point of the EPL is that it's staffed from OUTSIDE the
    // club being served — filter out anyone who currently belongs to
    // schoolId, in addition to the server-side check on the write path.
    eplSearchResults = (data.members || []).filter((m) => m.schoolId !== schoolId);
    if (!eplSearchResults.length) {
      resultsEl.innerHTML = '<div class="empty-state">Aucun membre trouvé hors de ce club.</div>';
      return;
    }
    resultsEl.innerHTML = eplSearchResults.map((m) => `
      <div class="list-item" data-epl-candidate="${m.id}">
        <div class="who" style="display:flex;align-items:center;gap:8px;">
          ${m.profilePictureUrl ? `<img src="${m.profilePictureUrl}" alt="" style="width:28px;height:28px;border-radius:50%;">` : ""}
          <strong>${esc(m.displayName)}</strong><span style="opacity:.7;">@${esc(m.username)}</span>
        </div>
        <div class="role-chip-row" style="margin-top:6px;">
          ${EPL_ROLES.map((r) => `<button type="button" class="role-chip" data-epl-assign="${r.value}" data-epl-assign-member="${m.id}">${r.label}</button>`).join("")}
        </div>
      </div>
    `).join("");
  }

  async function loadEplForCurrentSchool() {
    if (!currentSchoolId) return [];
    const data = await callRoles({ action: "listEpl", schoolId: currentSchoolId });
    return data.members || [];
  }

  function bindEplHandlers() {
    const searchInput = document.getElementById("epl-search");
    if (searchInput) {
      let debounceTimer = null;
      searchInput.addEventListener("input", () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          runEplSearch(searchInput.value, currentSchoolId).catch((err) => alert(err.message || "Échec de la recherche."));
        }, 250);
      });
    }

    const resultsEl = document.getElementById("epl-search-results");
    if (resultsEl) {
      resultsEl.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-epl-assign]");
        if (!btn) return;
        try {
          await callRoles({
            action: "setEplRole",
            memberId: btn.dataset.eplAssignMember,
            schoolId: currentSchoolId,
            role: btn.dataset.eplAssign,
          });
          await renderDetail();
        } catch (err) {
          alert(err.message || "Échec de la requête.");
        }
      });
    }

    detailPanel.querySelectorAll("[data-epl-remove]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        try {
          await callRoles({
            action: "clearEplRole",
            memberId: btn.dataset.eplRemoveMember,
            schoolId: currentSchoolId,
            role: btn.dataset.eplRemove,
          });
          await renderDetail();
        } catch (err) {
          alert(err.message || "Échec de la requête.");
        }
      });
    });
  }

  async function renderDetail() {
    detailPanel.innerHTML = '<div class="empty-state">Chargement…</div>';
    const [data, eplForSchool] = await Promise.all([
      callRoles({ action: "list", memberId: currentMemberId }),
      loadEplForCurrentSchool(),
    ]);

    const currentDisplay = data.roleHistory.find(
      (r) => !r.ended_at && r.school_id === currentSchoolId
    );
    const pastForSchool = data.roleHistory.filter((r) => r.school_id === currentSchoolId);
    const activeCapsForSchool = data.capabilities.filter((c) => c.school_id === currentSchoolId);
    const activeCapValues = new Set(activeCapsForSchool.map((c) => c.capability));
    const activeNationalValues = new Set(data.nationalRoles.map((r) => r.role));
    const activeNationalCapabilityValues = new Set((data.nationalCapabilities || []).map((c) => c.capability));

    detailPanel.innerHTML = `
      <div class="role-section-label">Statut officiel d'adhésion</div>
      <div class="form-grid" style="align-items:end; margin-bottom:18px;">
        <div class="form-field"><label for="membership-status">Statut</label><select id="membership-status">${MEMBERSHIP_STATUSES.map(s => `<option value="${s.value}"${data.membershipStatus === s.value ? " selected" : ""}>${s.label}</option>`).join("")}</select></div>
        <div class="form-field"><label for="membership-reason">Motif / source (optionnel)</label><input id="membership-reason" placeholder="Assemblée, validation, mandat…"></div>
        <div class="form-actions"><button class="btn btn-primary btn-sm" id="save-membership-status" type="button">Enregistrer le statut</button></div>
      </div>

      <div class="role-section-label">Rôle d'affichage pour ce club</div>
      <div class="role-chip-row" id="display-chips">
        ${DISPLAY_ROLES.map(
          (r) => `<button class="role-chip${currentDisplay && currentDisplay.role === r.value ? " selected" : ""}"
                    data-role="${r.value}">${r.label}</button>`
        ).join("")}
        ${currentDisplay ? `<button class="role-chip" id="clear-display-role" style="color:#B23A3A;">Retirer le rôle actuel</button>` : ""}
      </div>

      <div class="role-section-label">Capacités internes pour ce club</div>
      <p class="field-hint" style="margin:-4px 0 10px;">Cumulables, indépendantes du rôle d'affichage ci-dessus.</p>
      <div class="role-chip-row" id="capability-chips">
        ${CAPABILITIES.map(
          (c) => `<button class="role-chip${activeCapValues.has(c.value) ? " granted" : ""}"
                    data-capability="${c.value}">${c.label}${activeCapValues.has(c.value) ? " ✓" : ""}</button>`
        ).join("")}
      </div>

      <div class="role-section-label">Validation Formateur</div>
      <div class="form-grid" style="align-items:end; margin-bottom:12px;">
        <div class="form-field"><label for="trainer-status">Statut d'homologation</label><select id="trainer-status"><option value="pending">En attente</option><option value="verified">Homologué</option><option value="suspended">Suspendu</option></select></div>
        <div class="form-actions"><button class="btn btn-primary btn-sm" id="save-trainer-status" type="button">Enregistrer</button></div>
      </div>
      <div class="list-stack" style="margin-bottom:18px;">${(data.documents || []).length ? data.documents.map(d => `<div class="list-item"><div class="list-item-main"><span class="list-item-title">${esc(d.title)}</span><span class="list-item-meta">${esc(d.document_type)} · ${esc(d.status)}</span></div></div>`).join("") : '<p class="field-hint">Aucun document dans le dossier.</p>'}</div>

      <div class="role-section-label">Permissions nationales</div>
      <p class="field-hint" style="margin:-4px 0 10px;">Permissions transversales, sans lien avec le club sélectionné.</p>
      <div class="role-chip-row" id="national-capability-chips">
        ${NATIONAL_CAPABILITIES.map(
          (c) => `<button class="role-chip${activeNationalCapabilityValues.has(c.value) ? " granted" : ""}" data-national-capability="${c.value}">${c.label}${activeNationalCapabilityValues.has(c.value) ? " ✓" : ""}</button>`
        ).join("")}
      </div>

      <div class="role-section-label">Rôles nationaux</div>
      <p class="field-hint" style="margin:-4px 0 10px;">Portée nationale, indépendante de ce club et du statut d'admin national.</p>
      <div class="role-chip-row" id="national-chips">
        ${NATIONAL_ROLES.map(
          (r) => `<button class="role-chip${activeNationalValues.has(r.value) ? " granted" : ""}"
                    data-national="${r.value}">${r.label}${activeNationalValues.has(r.value) ? " ✓" : ""}</button>`
        ).join("")}
      </div>

      <div class="role-section-label">Équipe Plénière Nationale (EPN)</div>
      <p class="field-hint" style="margin:-4px 0 10px;">Cumulable (un membre peut tenir plusieurs postes) et indépendante de ce club. Ses membres sont automatiquement listés comme participants sur chaque AG nationale.</p>
      <div class="role-chip-row" id="epn-chips">
        ${EPN_ROLES.map(
          (r) => `<button class="role-chip${activeNationalValues.has(r.value) ? " granted" : ""}"
                    data-national="${r.value}">${r.label}${activeNationalValues.has(r.value) ? " ✓" : ""}</button>`
        ).join("")}
      </div>

      <div class="role-section-label">Équipe Plénière Locale (EPL) — pour ce club</div>
      <p class="field-hint" style="margin:-4px 0 10px;">L'équipe qui préside les assemblées locales (ALOFM/ALE/ALOE) de ce club. Ses membres doivent obligatoirement venir d'un <strong>autre</strong> club — recherchez-les par nom ci-dessous.</p>
      ${renderEplSection(eplForSchool)}

      <div class="role-section-label">Historique des postes (ce club)</div>
      ${
        pastForSchool.length === 0
          ? '<p class="field-hint">Aucun historique pour ce club.</p>'
          : pastForSchool
              .map((r) => {
                const label = DISPLAY_ROLES.find((d) => d.value === r.role)?.label || r.role;
                const start = new Date(r.started_at).toLocaleDateString("fr-FR");
                const end = r.ended_at ? new Date(r.ended_at).toLocaleDateString("fr-FR") : "aujourd'hui";
                return `<div class="history-row${!r.ended_at ? " current" : ""}">
                  <span class="role-name">${esc(label)}</span>
                  <span class="dates">${start} – ${end}</span>
                </div>`;
              })
              .join("")
      }
    `;

    // Wraps a chip/button click handler so a failed request (invalid
    // role, member no longer active, session expired, server error…)
    // surfaces to the admin via alert() instead of failing silently —
    // without this, a thrown error inside an async click handler just
    // rejects unnoticed and the UI looks like the click did nothing.
    function guarded(handler) {
      return async (e) => {
        try {
          await handler(e);
        } catch (err) {
          alert(err.message || "Échec de la requête.");
        }
      };
    }

    const trainerStatus = document.getElementById("trainer-status");
    if (data.trainerProfile) trainerStatus.value = data.trainerProfile.certification_status || "pending";
    document.getElementById("save-trainer-status").addEventListener("click", guarded(async () => {
      await callRoles({ action: "setTrainerStatus", memberId: currentMemberId, certificationStatus: trainerStatus.value });
      await renderDetail();
    }));

    document.getElementById("save-membership-status").addEventListener("click", guarded(async () => {
      await callRoles({
        action: "setMembershipStatus",
        memberId: currentMemberId,
        membershipStatus: document.getElementById("membership-status").value,
        reason: document.getElementById("membership-reason").value,
      });
      await renderDetail();
    }));

    document.getElementById("display-chips").addEventListener("click", guarded(async (e) => {
      const clear = e.target.closest("#clear-display-role");
      if (clear) {
        await callRoles({ action: "clearDisplayRole", memberId: currentMemberId, schoolId: currentSchoolId });
        await renderDetail();
        return;
      }
      const chip = e.target.closest(".role-chip[data-role]");
      if (!chip) return;
      await callRoles({
        action: "setDisplayRole",
        memberId: currentMemberId,
        schoolId: currentSchoolId,
        role: chip.dataset.role,
      });
      await renderDetail();
    }));

    document.getElementById("capability-chips").addEventListener("click", guarded(async (e) => {
      const chip = e.target.closest(".role-chip[data-capability]");
      if (!chip) return;
      const capability = chip.dataset.capability;
      const action = activeCapValues.has(capability) ? "revokeCapability" : "grantCapability";
      await callRoles({ action, memberId: currentMemberId, schoolId: currentSchoolId, capability });
      await renderDetail();
    }));

    document.getElementById("national-capability-chips").addEventListener("click", guarded(async (e) => {
      const chip = e.target.closest(".role-chip[data-national-capability]");
      if (!chip) return;
      const capability = chip.dataset.nationalCapability;
      const action = activeNationalCapabilityValues.has(capability) ? "revokeNationalCapability" : "grantNationalCapability";
      await callRoles({ action, memberId: currentMemberId, capability });
      await renderDetail();
    }));

    document.getElementById("national-chips").addEventListener("click", guarded(async (e) => {
      const chip = e.target.closest(".role-chip[data-national]");
      if (!chip) return;
      const role = chip.dataset.national;
      const action = activeNationalValues.has(role) ? "clearNationalRole" : "setNationalRole";
      await callRoles({ action, memberId: currentMemberId, role });
      await renderDetail();
    }));

    document.getElementById("epn-chips").addEventListener("click", guarded(async (e) => {
      const chip = e.target.closest(".role-chip[data-national]");
      if (!chip) return;
      const role = chip.dataset.national;
      const action = activeNationalValues.has(role) ? "clearNationalRole" : "setNationalRole";
      await callRoles({ action, memberId: currentMemberId, role });
      await renderDetail();
    }));

    bindEplHandlers();
  }

  schoolSelect.addEventListener("change", async () => {
    currentSchoolId = schoolSelect.value ? Number(schoolSelect.value) : null;
    currentMemberId = null;
    if (!currentSchoolId) {
      twoCol.style.display = "none";
      detailPanel.innerHTML = '<div class="empty-state">Sélectionnez un membre à gauche.</div>';
      return;
    }
    twoCol.style.display = "flex";
    await renderEplOnlyPanel();
    await loadMembers(currentSchoolId);
  });

  // Shown right after picking a club, before any member is selected —
  // EPL is a per-club roster, not a per-member one, so an admin
  // shouldn't have to click an arbitrary member first just to see or
  // edit who's currently seated on this club's plenary team.
  async function renderEplOnlyPanel() {
    const eplForSchool = await loadEplForCurrentSchool();
    detailPanel.innerHTML = `
      <div class="role-section-label">Équipe Plénière Locale (EPL) — pour ce club</div>
      <p class="field-hint" style="margin:-4px 0 10px;">L'équipe qui préside les assemblées locales (ALOFM/ALE/ALOE) de ce club. Ses membres doivent obligatoirement venir d'un <strong>autre</strong> club — recherchez-les par nom ci-dessous.</p>
      ${renderEplSection(eplForSchool)}
      <p class="field-hint" style="margin-top:16px;">Sélectionnez un membre à gauche pour gérer ses autres rôles (affichage, capacités, rôles nationaux…).</p>
    `;
    bindEplHandlers();
  }

  await loadSchools();
})();
</script>
</body>
</html>
