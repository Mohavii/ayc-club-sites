<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Éditeur de PV · Portail YOUTHCLUBber</title>
  <link rel="icon" href="../assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="portal.css">
  <style>
    body { background: #f5f7fa; }
    .pv-editor-shell { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .pv-editor-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding: 26px 30px 20px; background: linear-gradient(180deg, #fbfdff, #f5f8fc); border-bottom: 1px solid #e5eaf2; border-radius: 16px 16px 0 0; }
    .pv-editor-header h2 { margin: 5px 0 7px; color: var(--portal-navy); font: 400 2rem "Fjalla One", sans-serif; }
    .pv-editor-header p { margin: 0; color: #72809a; font-size: .85rem; }
    
    /* ---- PV editor styles from meetings.html ---- */
    .pv-points{display:grid;gap:14px;margin-top:4px}
    .pv-point-card{border:1px solid #e2e8f1;border-radius:14px;background:#fff;overflow:hidden}
    .pv-point-head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(180deg,#fbfdff,#f5f8fc);border-bottom:1px solid #edf0f6}
    .pv-point-number{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#e9f0ff;color:#2f4bd0;font-weight:900;font-size:.8rem}
    .pv-point-head-fields{flex:1;min-width:0;display:grid;grid-template-columns:1fr 140px;gap:10px}
    .pv-point-body{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .pv-point-body .pv-field{display:grid;gap:6px}
    .pv-point-body .pv-field.full{grid-column:1/-1}
    .pv-field label{font-size:.7rem;font-weight:900;letter-spacing:.03em;color:#7a869a;text-transform:uppercase}
    .pv-point-card input,.pv-point-card textarea{width:100%;box-sizing:border-box;border:1px solid #d9dfeb;border-radius:10px;background:#fff;padding:10px 11px;color:#263653;font:inherit;font-size:.83rem;outline:none;transition:border-color .18s ease,box-shadow .18s ease}
    .pv-point-card input:focus,.pv-point-card textarea:focus{border-color:#5b82d0;box-shadow:0 0 0 3px rgba(91,130,208,.12)}
    .pv-point-card textarea{min-height:78px;resize:vertical;line-height:1.45}
    .pv-attachments{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
    .pv-attachment-pill{display:inline-flex;align-items:center;gap:6px;background:#eef0fa;border-radius:999px;padding:4px 10px;font-size:.78rem;color:#3d4861}
    .pv-attachment-pill button{border:none;background:none;cursor:pointer;color:#8a8fa6;font-size:.9rem;line-height:1}
    .pv-add-file{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
    .pv-add-file input{flex:1;min-width:110px}
    .pv-point-foot{display:flex;justify-content:flex-end;padding:0 16px 14px}
    .pv-point-remove{color:#a34450}
    .pv-organizer-row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
    .pv-organizer-row .form-field{flex:1;min-width:220px}
    .pv-organizer-hint{font-size:.72rem;color:#7a869a;margin-top:4px}
    .pv-attendance-grid{display:grid;gap:8px;margin-top:6px}
    .pv-attendance-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid #edf0f6;border-radius:10px;background:#fff}
    .pv-attendance-row .name{font-weight:700;color:var(--portal-navy);font-size:.84rem}
    .pv-attendance-row .name small{display:block;font-weight:500;color:#8792a6;font-size:.7rem;margin-top:1px}
    .pv-attendance-row select{border:1px solid #dce3ef;border-radius:8px;padding:7px 9px;color:#3d4861;background:#fff;font:inherit;font-size:.76rem}
    .pv-attendance-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
  </style>
</head>
<body>
  <div class="pv-editor-shell">
    <header class="pv-editor-header">
      <div>
        <p class="eyebrow">Éditeur de Procès-Verbal</p>
        <h2 id="meeting-title">Chargement...</h2>
        <p id="meeting-meta"></p>
      </div>
      <div>
        <button class="btn btn-secondary btn-sm" id="btn-close">Fermer</button>
      </div>
    </header>

    <div id="pv-editor-content">
      <!-- PV Editor will be rendered here -->
    </div>
    
    <div id="notice" style="padding: 20px 30px;"></div>
  </div>

  <script src="portal-common.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const meetingId = urlParams.get('meetingId');
    let meetingData = null;
    let pvBlocks = [];
    let member = null;

    const esc = AYCPortal.escapeHtml;

    function pvPointCard(block, index) {
      const attachmentsHtml = (block.attachments || []).map((f, fi) => `<span class="pv-attachment-pill">${esc(f.name || f.url)}<button type="button" data-remove-file="${index}:${fi}">✕</button></span>`).join('');
      return `<div class="pv-point-card" data-block="${index}">
        <div class="pv-point-head">
          <span class="pv-point-number">${index + 1}</span>
          <div class="pv-point-head-fields">
            <input type="text" class="pv-title" placeholder="Point de l'ordre du jour" value="${esc(block.title)}">
            <input type="number" class="pv-duration" min="0" placeholder="Durée est. (min)" value="${block.durationMinutes ?? ''}">
          </div>
        </div>
        <div class="pv-point-body">
          <div class="pv-field"><label>Durée réelle</label><input type="number" class="pv-actual-duration" min="0" placeholder="min" value="${block.actualDurationMinutes ?? ''}"></div>
          <div class="pv-field"><label>Fichiers joints</label>
            <div class="pv-attachments">${attachmentsHtml}</div>
            <div class="pv-add-file"><input type="text" class="pv-file-name" placeholder="Nom du fichier"><input type="url" class="pv-file-url" placeholder="Lien"><button type="button" class="btn btn-quiet btn-sm" data-add-file="${index}">+</button></div>
          </div>
          <div class="pv-field full"><label>Discussions</label><textarea class="pv-discussion" placeholder="Ce qui a été discuté">${esc(block.discussion)}</textarea></div>
          <div class="pv-field"><label>Conclusions</label><textarea class="pv-decision" placeholder="Ce qui a été décidé">${esc(block.decision)}</textarea></div>
          <div class="pv-field"><label>Conduites à tenir et échéances</label><textarea class="pv-next-steps" placeholder="Qui fait quoi, pour quand">${esc(block.nextSteps)}</textarea></div>
        </div>
        <div class="pv-point-foot"><button type="button" class="btn btn-quiet btn-sm pv-point-remove" data-remove-point="${index}">Supprimer ce point</button></div>
      </div>`;
    }

    function pvOrganizerFieldMarkup(minutes, eplMembers, secretaryName) {
      const current = minutes?.organizer || '';
      // For reunions, the rédacteur is ALWAYS the club secretary
      const autoValue = current || secretaryName || '';
      const hint = secretaryName
        ? `Rédigé par le Secrétaire du club (${esc(secretaryName)}).`
        : `Aucun Secrétaire de club enregistré.`;
      return `<div class="form-field"><label for="pv-organizer">Rédigé par</label><input id="pv-organizer" value="${esc(autoValue)}" readonly><p class="pv-organizer-hint">${hint}</p></div>`;
    }

    function pvAttendanceFieldMarkup(roster, savedAttendance) {
      if (!roster || !roster.length) return '';
      const savedByMember = new Map((savedAttendance || []).map(row => [String(row.memberId ?? row.member_id), row]));
      const rows = roster.map(m => {
        const saved = savedByMember.get(String(m.id));
        const status = saved?.attendanceStatus || saved?.attendance_status || 'present';
        const options = [['present', 'Présent·e'], ['absent', 'Absent·e'], ['excused', 'Excusé·e'], ['late', 'En retard']]
          .map(([v, l]) => `<option value="${v}"${status === v ? ' selected' : ''}>${l}</option>`).join('');
        return `<div class="pv-attendance-row" data-member="${m.id}"><span class="name">${esc(m.display_name || m.username)}</span><select class="pv-attendance-status">${options}</select></div>`;
      }).join('');
      return `<div class="pv-attendance-toolbar"><div><p class="eyebrow" style="margin:0 0 2px">Présence</p><p class="pv-organizer-hint" style="margin:0">Tous les membres actifs du club sont listés.</p></div><button type="button" class="btn btn-quiet btn-sm" id="pv-mark-all-present">Tout marquer présent</button></div>
        <div class="pv-attendance-grid" id="pv-attendance-grid">${rows}</div>`;
    }

    function renderPvEditor(canEditPV, minutes, roster, eplMembers, savedAttendance, isNationalMeeting, secretaryName) {
      if (!canEditPV) return '<p>Vous n\'avez pas la permission d\'éditer ce PV.</p>';
      const cardsHtml = pvBlocks.map((b, i) => pvPointCard(b, i)).join('');
      return `<section class="portal-card" style="margin-top:18px">
        <div class="toolbar"><div><p class="eyebrow">Procès-verbal</p><h2>Rédiger le PV</h2></div></div>
        <div class="pv-points" id="pv-editor-table">${cardsHtml}</div>
        <button type="button" class="btn btn-quiet btn-sm" id="pv-add-point" style="margin-top:10px">+ Ajouter un point</button>
        <div class="form-grid" style="margin-top:14px">
          ${pvOrganizerFieldMarkup(minutes, eplMembers, secretaryName)}
          <div class="form-field"><label for="pv-status">Statut</label><select id="pv-status"><option value="draft"${(!minutes || minutes.status==='draft') ? ' selected' : ''}>Brouillon</option><option value="sent"${minutes?.status==='sent' ? ' selected' : ''}>Publié</option><option value="validated"${minutes?.status==='validated' ? ' selected' : ''}>Validé</option></select></div>
        </div>
        ${isNationalMeeting ? '' : `<div style="margin-top:16px">${pvAttendanceFieldMarkup(roster, savedAttendance)}</div>`}
        <div class="form-actions"><button type="button" class="btn btn-primary" id="pv-save">Enregistrer le PV</button></div>
      </section>`;
    }

    function bindPvEditor(canEditPV, roster, isNationalMeeting) {
      const table = document.getElementById('pv-editor-table');
      if (!table) return;
      
      function readRowsIntoState() {
        table.querySelectorAll('.pv-point-card[data-block]').forEach(row => {
          const i = Number(row.dataset.block);
          if (!pvBlocks[i]) return;
          pvBlocks[i].title = row.querySelector('.pv-title').value.trim();
          pvBlocks[i].durationMinutes = row.querySelector('.pv-duration').value ? Number(row.querySelector('.pv-duration').value) : null;
          pvBlocks[i].actualDurationMinutes = row.querySelector('.pv-actual-duration').value ? Number(row.querySelector('.pv-actual-duration').value) : null;
          pvBlocks[i].discussion = row.querySelector('.pv-discussion').value.trim();
          pvBlocks[i].decision = row.querySelector('.pv-decision').value.trim();
          pvBlocks[i].nextSteps = row.querySelector('.pv-next-steps').value.trim();
        });
      }
      
      document.getElementById('pv-add-point').addEventListener('click', () => {
        readRowsIntoState();
        pvBlocks.push({ title: '', durationMinutes: null, actualDurationMinutes: null, discussion: '', decision: '', nextSteps: '', attachments: [] });
        table.innerHTML = pvBlocks.map((b, i) => pvPointCard(b, i)).join('');
        bindRowFileButtons();
      });
      
      function bindRowFileButtons() {
        table.querySelectorAll('[data-add-file]').forEach(btn => btn.addEventListener('click', () => {
          readRowsIntoState();
          const i = Number(btn.dataset.addFile);
          const row = table.querySelector(`.pv-point-card[data-block="${i}"]`);
          const name = row.querySelector('.pv-file-name').value.trim();
          const url = row.querySelector('.pv-file-url').value.trim();
          if (!url) return;
          pvBlocks[i].attachments = [...(pvBlocks[i].attachments || []), { name: name || url, url }];
          table.innerHTML = pvBlocks.map((b, ii) => pvPointCard(b, ii)).join('');
          bindRowFileButtons();
        }));
        table.querySelectorAll('[data-remove-file]').forEach(btn => btn.addEventListener('click', () => {
          readRowsIntoState();
          const [i, fi] = btn.dataset.removeFile.split(':').map(Number);
          pvBlocks[i].attachments.splice(fi, 1);
          table.innerHTML = pvBlocks.map((b, ii) => pvPointCard(b, ii)).join('');
          bindRowFileButtons();
        }));
        table.querySelectorAll('[data-remove-point]').forEach(btn => btn.addEventListener('click', () => {
          readRowsIntoState();
          const i = Number(btn.dataset.removePoint);
          if (pvBlocks.length <= 1) return;
          pvBlocks.splice(i, 1);
          table.innerHTML = pvBlocks.map((b, ii) => pvPointCard(b, ii)).join('');
          bindRowFileButtons();
        }));
      }
      
      bindRowFileButtons();
      document.getElementById('pv-mark-all-present')?.addEventListener('click', () => {
        document.querySelectorAll('#pv-attendance-grid .pv-attendance-status').forEach(select => { select.value = 'present'; });
      });
      
      document.getElementById('pv-save').addEventListener('click', async () => {
        readRowsIntoState();
        const attendance = Array.from(document.querySelectorAll('#pv-attendance-grid .pv-attendance-row')).map(row => ({
          memberId: row.dataset.member,
          attendanceStatus: row.querySelector('.pv-attendance-status').value,
        }));
        const noticeEl = document.getElementById('notice');
        try {
          await AYCPortal.api('meeting', { method: 'POST', body: {
            action: 'save_minutes', meetingId,
            organizer: document.getElementById('pv-organizer').value.trim(),
            status: document.getElementById('pv-status').value,
            agendaBlocks: pvBlocks.filter(b => b.title),
            attendance,
          } });
          noticeEl.innerHTML = '<div class="alert alert-success">Le procès-verbal a été enregistré.</div>';
          setTimeout(() => window.close(), 2000);
        } catch (e) {
          AYCPortal.renderError(noticeEl, e);
        }
      });
    }

    async function load() {
      if (!meetingId) {
        document.getElementById('meeting-title').textContent = 'Aucune réunion sélectionnée';
        return;
      }

      try {
        meetingData = await AYCPortal.api('meeting', { query: { meetingId } });
        const m = meetingData.meeting;
        
        document.getElementById('meeting-title').textContent = m.title;
        document.getElementById('meeting-meta').textContent = `${AYCPortal.formatDate(m.starts_at, true)} · ${esc(m.location || 'Lieu à confirmer')}`;
        
        const typeLabels = { 
          reunion_nationale: 'Réunion nationale', 
          alofm: 'ALOFM', 
          ale: 'ALE', 
          aloe: 'ALOE',
          agomm: 'AGOMM',
          agofm: 'AGOFM',
          age: 'AGE'
        };

        // Load existing PV blocks
        const saved = meetingData.structured?.agendaBlocks || [];
        if (saved.length) {
          pvBlocks = saved.map(b => ({ title: b.title || '', durationMinutes: b.duration_minutes || null, actualDurationMinutes: b.actual_duration_minutes || null, discussion: b.discussion || '', decision: b.decision || '', nextSteps: b.next_steps || '', attachments: b.attachments || [] }));
        } else {
          pvBlocks = (meetingData.agendaItems || []).map(item => ({ title: item.title || '', durationMinutes: item.duration_minutes || null, actualDurationMinutes: null, discussion: '', decision: '', nextSteps: '', attachments: [] }));
        }
        if (!pvBlocks.length) pvBlocks = [{ title: '', durationMinutes: null, actualDurationMinutes: null, discussion: '', decision: '', nextSteps: '', attachments: [] }];
        
        const canEditPV = meetingData.canEditPV || member?.isNationalAdmin;
        
        // Find the club secretary from the roster
        const secretary = (meetingData.roster || []).find(r => r.role === 'secretaire' || r.display_role === 'secretaire');
        const secretaryName = secretary ? (secretary.display_name || secretary.username) : null;
        
        document.getElementById('pv-editor-content').innerHTML = renderPvEditor(canEditPV, meetingData.minutes, meetingData.roster, meetingData.eplMembers, meetingData.structured?.attendance, m.meeting_type === 'reunion_nationale', secretaryName);
        
        bindPvEditor(canEditPV, meetingData.roster, m.meeting_type === 'reunion_nationale');
        
      } catch (e) {
        AYCPortal.renderError(document.getElementById('notice'), e);
      }
    }

    document.getElementById('btn-close').addEventListener('click', () => window.close());

    // Initialize
    (async () => {
      member = await AYCPortal.initPortalShell({ requireActive: true });
      if (!member) return;
      await load();
    })();
  </script>
</body>
</html>
