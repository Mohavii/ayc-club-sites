<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cursus · Portail YOUTHCLUBber</title><link rel="icon" href="../assets/favicon-32.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="portal.css"></head>
<body><div id="topbar-root"></div><div class="workspace"><div id="sidebar-root"></div><main class="portal-content"><div class="portal-heading"><div><p class="eyebrow">Développement des compétences</p><h1>Mon cursus</h1><p>Visualise les étapes de progression YOUTHCLUBber et garde une trace de tes formations reçues, dispensées et facilitations.</p></div></div><div id="notice"></div><section class="portal-card"><h2>Parcours YOUTHCLUBber</h2><div class="list-stack" id="path"></div></section><div class="portal-grid" style="margin-top:18px"><section class="portal-card card-span-8"><div class="toolbar"><h2>Portfolio Formateur</h2><button class="btn btn-secondary btn-sm" id="reload">Actualiser</button></div><div class="table-wrap"><table class="portal-table"><thead><tr><th>Catégorie</th><th>Intitulé</th><th>Hôte / date</th><th>Heures</th></tr></thead><tbody id="entries"></tbody></table></div></section><section class="portal-card card-span-4 red-theme"><h2>Ajouter une entrée</h2><form id="training-form"><div class="form-field"><label for="category">Catégorie</label><select id="category"><option value="received">Formation reçue</option><option value="delivered">Formation dispensée</option><option value="facilitation">Facilitation délivrée</option><option value="other">Autre</option></select></div><div class="form-field"><label for="title">Titre</label><input id="title" required></div><div class="form-field"><label for="host">Hôte</label><input id="host"></div><div class="form-field"><label for="heldOn">Date</label><input id="heldOn" type="date"></div><div class="form-field"><label for="hours">Heures</label><input id="hours" type="number" min="0" step="0.5"></div><div class="form-field"><label for="location">Lieu</label><input id="location"></div><div class="form-field"><label for="bookletUrl">Lien du cahier / guide</label><input id="bookletUrl" type="url"></div><div class="form-actions"><button class="btn btn-primary" type="submit">Ajouter</button></div></form></section></div></main></div>
<script src="portal-common.js"></script><script>
(async()=>{try{const m=await AYCPortal.initPortalShell({requireActive:true});if(!m)return;const tiers=['YOUTH CLUBeur','Responsable Local','Responsable Régional','Responsable National','Formateur Yathyouth','Conseil Stratégique'];document.getElementById('path').innerHTML=tiers.map((x,i)=>`<div class="list-item"><div class="list-item-main"><span class="list-item-title">${i===0?'✓ ':''}${x}</span><span class="list-item-meta">${i===0?'Point de départ du parcours':'Guide et cahier d’exercice à venir'}</span></div><span class="status-badge ${i===0?'status-active':''}">${i===0?'Terminé':i===1?'En cours':'À débuter'}</span></div>`).join('');const load=async()=>{const entries=(await AYCPortal.api('training')).entries||[];document.getElementById('entries').innerHTML=entries.length?entries.map(e=>`<tr><td>${AYCPortal.escapeHtml(e.category)}</td><td><strong>${AYCPortal.escapeHtml(e.title)}</strong><br><small>${AYCPortal.escapeHtml(e.location||'')}</small></td><td>${AYCPortal.escapeHtml(e.host||'—')}<br>${AYCPortal.formatDate(e.held_on)}</td><td>${e.hours||'—'}</td></tr>`).join(''):`<tr><td colspan="4">${AYCPortal.renderEmpty('Aucune entrée dans ton portfolio')}</td></tr>`};await load();document.getElementById('reload').onclick=load;document.getElementById('training-form').addEventListener('submit',async e=>{e.preventDefault();const f=id=>document.getElementById(id).value;try{await AYCPortal.api('training',{method:'POST',body:{category:f('category'),title:f('title'),host:f('host'),heldOn:f('heldOn'),hours:f('hours'),location:f('location'),bookletUrl:f('bookletUrl')}});e.target.reset();await load()}catch(err){AYCPortal.renderError(document.getElementById('notice'),err)}})}catch(e){AYCPortal.renderError(document.getElementById('notice'),e)}})();
</script></body></html>
