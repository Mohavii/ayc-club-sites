<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Projets · Portail YOUTHCLUBber</title>
  <link rel="icon" href="../assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <div id="topbar-root"></div>
  <div class="workspace"><div id="sidebar-root"></div><main class="portal-content">
    <div class="portal-heading">
      <div><p class="eyebrow">Vie des projets</p><h1>Projets</h1><p>Retrouve les projets de ton club et les projets nationaux, puis consulte les équipes et les tâches qui te concernent.</p></div>
      <div class="heading-actions" id="project-actions"></div>
    </div>
    <div id="notice"></div>
    <section class="portal-card project-directory-card">
      <div class="toolbar"><div><p class="eyebrow">Portefeuille AYC</p><h2>Projets locaux et nationaux</h2></div><div class="filter-tabs" id="project-filters"><button class="active" data-filter="all">Tous</button><button data-filter="local">Locaux</button><button data-filter="national">Nationaux</button></div></div>
      <div id="project-list" class="project-directory"></div>
    </section>
    <section id="project-detail"></section>
    <div id="project-modal-root"></div>
  </main></div>
<script src="portal-common.js"></script>
<script>
(async () => {
  const list = document.getElementById('project-list');
  const detail = document.getElementById('project-detail');
  const actions = document.getElementById('project-actions');
  const notice = document.getElementById('notice');
  const esc = AYCPortal.escapeHtml;
  const statusLabels = { draft: 'Brouillon', in_progress: 'En cours', completed: 'Terminé', cancelled: 'Annulé' };
  const memberStatusLabels = { nouveau_adherent: 'Nouveau adhérent', adherent: 'Membre actif', responsable: 'Responsable', senior: 'Senior', membre_national: 'Membre national', ancien: 'Ancien' };
  let member, projects = [], filter = 'all';

  const showError = e => AYCPortal.renderError(notice, e);
  const parseMembers = value => { if (Array.isArray(value)) return value; try { const parsed = JSON.parse(value || '[]'); return Array.isArray(parsed) ? parsed : []; } catch { return []; } };
  const projectScope = p => p.scope === 'national' ? 'Projet national' : `Projet local · ${p.school_name || 'Mon club'}`;
  const projectStatus = s => statusLabels[s] || s || 'À préciser';
  const memberOptions = (members, selected = '') => `<option value="">Choisir un membre…</option>${members.map(m => `<option value="${esc(m.id)}"${String(m.id) === String(selected) ? ' selected' : ''}>${esc(m.display_name || m.displayName || m.username)}${m.membership_status ? ` · ${esc(memberStatusLabels[m.membership_status] || m.membership_status)}` : ''}</option>`).join('')}`;

  function renderList() {
    const rows = filter === 'all' ? projects : projects.filter(p => p.scope === filter);
    list.innerHTML = rows.length ? rows.map(p => `<article class="project-directory-row">
      <div class="project-scope-mark ${p.scope === 'national' ? 'national' : 'local'}">${p.scope === 'national' ? 'N' : 'L'}</div>
      <div class="list-item-main"><span class="list-item-title">${esc(p.title)}</span><span class="list-item-meta">${esc(projectScope(p))} · Président·e : ${esc(p.president_name || 'À désigner')}</span><span class="list-item-meta">${p.team_count || 0} équipe(s) · ${p.member_count || 0} membre(s) · ${p.task_count || 0} tâche(s)${p.starts_at ? ` · ${esc(AYCPortal.formatDate(p.starts_at))}` : ''}</span></div>
      <span class="status-badge status-${esc(p.status)}">${esc(projectStatus(p.status))}</span><button class="btn btn-secondary btn-sm" data-open-project="${esc(p.id)}">Voir le projet</button>
    </article>`).join('') : AYCPortal.renderEmpty(filter === 'national' ? 'Aucun projet national visible' : filter === 'local' ? 'Aucun projet local visible' : 'Aucun projet visible');
  }

  function createForm() {
    const canLocal = Boolean(member?.isNationalAdmin || member?.access?.canCreateProject);
    const canNational = Boolean(member?.isNationalAdmin || member?.access?.canCreateNationalProject);
    if (!canLocal && !canNational) return '';
    return `<section class="portal-card project-create-card" id="project-create-card"><div class="toolbar"><div><p class="eyebrow">Nouveau portefeuille</p><h2>Créer un projet</h2><p class="field-hint">La personne qui crée le projet devient automatiquement sa présidence.</p></div></div><form id="project-create-form" class="form-grid project-form-grid"><label class="form-field"><span>Portée</span><select id="project-scope">${canLocal ? '<option value="local">Projet local</option>' : ''}${canNational ? '<option value="national">Projet national</option>' : ''}</select></label><label class="form-field"><span>Titre</span><input id="project-title" required placeholder="Nom du projet"></label><label class="form-field"><span>Type</span><input id="project-type" placeholder="Projet, campagne, partenariat…"></label><label class="form-field"><span>Début</span><input id="project-starts" type="date"></label><label class="form-field"><span>Fin</span><input id="project-ends" type="date"></label><label class="form-field full"><span>Description</span><textarea id="project-description" placeholder="Objectif et périmètre du projet"></textarea></label><div class="form-actions full"><button class="btn btn-primary" type="submit">Créer le projet</button></div></form></section>`;
  }

  async function openProject(id) {
    detail.innerHTML = '<section class="portal-card"><p class="field-hint">Chargement du projet…</p></section>';
    try {
      const data = await AYCPortal.api('projects', { query: { projectId: id } });
      renderDetail(data);
      detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) { showError(e); detail.innerHTML = ''; }
  }

  function renderDetail(data) {
    const p = data.project;
    const teams = data.teams || [];
    const eligible = data.eligibleMembers || [];
    const canManage = Boolean(data.canManage || member?.isNationalAdmin);
    const teamMarkup = teams.length ? teams.map(team => {
      const teamMembers = parseMembers(team.members);
      const canAssign = Boolean(member?.isNationalAdmin || String(team.supervisor_id) === String(member.id));
      return `<article class="project-team-card"><div class="project-team-header"><div><p class="eyebrow">Équipe</p><h3>${esc(team.name)}</h3><p class="list-item-meta">Superviseur·e : ${esc(team.supervisor_name || 'À désigner')}</p></div><span class="status-badge">${team.member_count || teamMembers.length} membre(s)</span></div><div class="project-member-chips">${teamMembers.length ? teamMembers.map(m => `<span class="project-member-chip">${esc(m.displayName || m.display_name || m.username)}</span>`).join('') : '<span class="field-hint">Aucun membre affecté.</span>'}</div>${canAssign ? `<div class="project-team-actions"><form class="project-inline-form assign-member-form" data-team="${esc(team.id)}"><select name="memberId" required>${memberOptions(eligible.filter(m => !teamMembers.some(tm => String(tm.id) === String(m.id))))}</select><button class="btn btn-secondary btn-sm" type="submit">Affecter un membre</button></form><form class="project-inline-form create-task-form" data-team="${esc(team.id)}"><select name="assignedTo" required>${memberOptions(teamMembers)}</select><input name="title" required placeholder="Tâche à assigner"><input name="deadline" type="date"><select name="priority"><option value="normale">Priorité moyenne</option><option value="basse">Faible</option><option value="haute">Élevée</option><option value="urgente">Urgente</option></select><button class="btn btn-primary btn-sm" type="submit">Assigner la tâche</button></form></div>` : ''}</article>`;
    }).join('') : '<p class="field-hint">Aucune équipe créée pour ce projet.</p>';
    const teamCreate = canManage ? `<section class="project-team-create"><div><h3>Créer une équipe</h3><p class="field-hint">Chaque équipe reçoit un superviseur qui pourra affecter ses membres et leurs tâches.</p></div><form id="team-create-form" class="form-grid project-form-grid"><label class="form-field"><span>Nom de l’équipe</span><input name="name" required placeholder="Équipe communication"></label><label class="form-field"><span>Superviseur·e</span><select name="supervisorId" required>${memberOptions(eligible)}</select></label><label class="form-field full"><span>Description</span><textarea name="description" placeholder="Mission de l’équipe"></textarea></label><div class="form-actions full"><button class="btn btn-secondary" type="submit">Créer l’équipe</button></div></form></section>` : '';
    detail.innerHTML = `<section class="portal-card project-detail-card"><div class="toolbar"><div><p class="eyebrow">${esc(projectScope(p))}</p><h2>${esc(p.title)}</h2><p class="list-item-meta">Président·e : ${esc(p.president_name || 'À désigner')} · ${esc(projectStatus(p.status))}</p></div><button class="btn btn-secondary btn-sm" id="close-project">Fermer</button></div><div class="project-detail-summary"><div><strong>${p.team_count || 0}</strong><span>Équipes</span></div><div><strong>${p.member_count || 0}</strong><span>Membres affectés</span></div><div><strong>${p.task_count || 0}</strong><span>Tâches</span></div></div>${p.description ? `<p class="project-description">${esc(p.description)}</p>` : ''}<section class="project-teams-section"><div class="project-section-heading"><div><p class="eyebrow">Organisation</p><h3>Équipes et supervision</h3></div>${canManage ? '<span class="section-note">Présidence du projet</span>' : ''}</div>${teamMarkup}</section>${teamCreate}<section class="project-tasks-section"><div class="project-section-heading"><div><p class="eyebrow">Suivi</p><h3>Tâches du projet</h3></div><a class="btn btn-secondary btn-sm" href="tasks">Ouvrir Mes tâches</a></div><div class="table-wrap"><table class="portal-table"><thead><tr><th>Tâche</th><th>Équipe</th><th>Membre</th><th>Échéance</th><th>Statut</th></tr></thead><tbody>${(data.tasks || []).length ? data.tasks.map(t => `<tr><td><strong>${esc(t.title)}</strong>${t.description ? `<br><small>${esc(t.description)}</small>` : ''}</td><td>${esc(t.team_name || '—')}</td><td>${esc(t.assigned_name || '—')}</td><td>${t.deadline ? esc(AYCPortal.formatDate(t.deadline)) : '—'}</td><td><span class="status-badge status-${esc(t.status)}">${esc(t.status)}</span></td></tr>`).join('') : '<tr><td colspan="5">Aucune tâche créée pour ce projet.</td></tr>'}</tbody></table></div></section></section>`;
    document.getElementById('close-project').onclick = () => { detail.innerHTML = ''; };
    document.getElementById('team-create-form')?.addEventListener('submit', async e => { e.preventDefault(); const form = e.currentTarget; const fd = new FormData(form); try { await AYCPortal.api('projects', { method: 'POST', body: { action: 'create_team', projectId: p.id, name: fd.get('name'), supervisorId: fd.get('supervisorId'), description: fd.get('description') } }); await openProject(p.id); } catch (err) { showError(err); } });
    detail.querySelectorAll('.assign-member-form').forEach(form => form.addEventListener('submit', async e => { e.preventDefault(); const fd = new FormData(form); try { await AYCPortal.api('projects', { method: 'POST', body: { action: 'assign_member', projectId: p.id, teamId: form.dataset.team, memberId: fd.get('memberId') } }); await openProject(p.id); } catch (err) { showError(err); } }));
    detail.querySelectorAll('.create-task-form').forEach(form => form.addEventListener('submit', async e => { e.preventDefault(); const fd = new FormData(form); try { await AYCPortal.api('projects', { method: 'POST', body: { action: 'create_task', projectId: p.id, teamId: form.dataset.team, assignedTo: fd.get('assignedTo'), title: fd.get('title'), deadline: fd.get('deadline'), priority: fd.get('priority') } }); await openProject(p.id); } catch (err) { showError(err); } }));
  }

  async function load() { projects = (await AYCPortal.api('projects')).projects || []; renderList(); }
  try {
    member = await AYCPortal.initPortalShell({ requireActive: true });
    if (!member) return;
    const formMarkup = createForm();
    if (formMarkup) { actions.innerHTML = '<a class="btn btn-primary" href="#project-create-card">Nouveau projet</a>'; document.querySelector('.project-directory-card').insertAdjacentHTML('afterend', formMarkup); document.getElementById('project-create-form').addEventListener('submit', async e => { e.preventDefault(); const scope = document.getElementById('project-scope').value; try { await AYCPortal.api('projects', { method: 'POST', body: { action: 'create', scope, title: document.getElementById('project-title').value.trim(), projectType: document.getElementById('project-type').value.trim(), startsAt: document.getElementById('project-starts').value || null, endsAt: document.getElementById('project-ends').value || null, description: document.getElementById('project-description').value.trim() } }); notice.innerHTML = '<div class="alert alert-success">Le projet a été créé. Tu en es automatiquement la présidence.</div>'; e.target.reset(); await load(); } catch (err) { showError(err); } }); }
    await load();
    document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => { document.querySelectorAll('[data-filter]').forEach(x => x.classList.remove('active')); button.classList.add('active'); filter = button.dataset.filter; renderList(); }));
    list.addEventListener('click', e => { const button = e.target.closest('[data-open-project]'); if (button) openProject(button.dataset.openProject); });
  } catch (e) { showError(e); }
})();
</script>
</body>
</html>
